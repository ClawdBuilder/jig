# A release is a tag. This job checks that the tag names the version in package.json, and writes the GitHub release from the
# changelog section of that version, so the notes a reader sees are the entries that shipped. Pushing the tag is the only step
# a person takes; running the workflow by hand publishes the page for a tag that has none, such as one tagged before this
# workflow existed. docs/releases.md has the rest.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to write a release for, such as v0.2.0.
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The tag's own commit, so its package.json and its changelog are the ones the release is about.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The tag, the manifest and the changelog are three names for one release: a tag that disagrees with either is a release
      # that ships something other than what its notes say, so it fails here instead of publishing.
      - name: The tag, package.json and the changelog agree
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${package}" ]; then
            echo "::error::tag ${TAG} does not name package.json's version ${package}"
            exit 1
          fi
          node scripts/release-notes.mjs "${version}" > /dev/null

      # Running this again is safe: a tag whose release exists is edited, not refused. A page published by hand for an older
      # tag does not become the latest release, which belongs to the newest tag.
      - name: Write the release
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          node scripts/release-notes.mjs "${TAG#v}" > "${notes}"
          latest=()
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            latest=(--latest=false)
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file "${notes}"
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file "${notes}" "${latest[@]}"
          fi

      # The same tag is the npm release. A manual run writes a page for an older tag; it does not publish that tag's code.
      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@clawdbuilder/jig@${version}" version > /dev/null 2>&1; then
            echo "npm already has @clawdbuilder/jig@${version}; nothing to publish"
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --provenance --access public
