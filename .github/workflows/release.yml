# A release is a tag. This job checks that the tag names the version in package.json, that ci-ok passed on the tagged commit,
# and that npm has the same tarball before it writes the GitHub release from the changelog section of that version. Pushing
# the tag is the only step a person takes; running the workflow by hand publishes the page for an older tag, without npm.
# docs/releases.md has the rest.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to write a release for, such as v0.2.0.
        required: true
        type: string

permissions:
  contents: write
  checks: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The tag's own commit, so its package.json and its changelog are the ones the release is about.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The tag, the manifest and the changelog are three names for one release: a tag that disagrees with either is a release
      # that ships something other than what its notes say, so it fails here instead of publishing.
      - name: The tag, package.json and the changelog agree
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${package}" ]; then
            echo "::error::tag ${TAG} does not name package.json's version ${package}"
            exit 1
          fi
          node scripts/release-notes.mjs "${version}" > /dev/null

      # A tag only releases code CI has already passed on that commit. The branch gate is not enough: this checks the
      # check-run on the tagged commit, so a tag moved onto an unchecked commit fails here.
      - name: Require ci-ok on the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest" \
            --jq '[.check_runs[] | select(.name == "ci-ok") | .conclusion] | join(",")')"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::ci-ok on ${GITHUB_SHA} is '${conclusion:-not run}'; refusing to publish"
            exit 1
          fi

      # The tarball integrity is the honest comparison for "is this version the code we tagged?". A version already on
      # npm is skipped only when its published tarball hash equals a fresh pack of this tag; a different hash fails.
      # The GitHub release is written only after the registry confirms the version, so a failed publish leaves no page.
      - name: Publish to npm, then confirm
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          packdir="$(mktemp -d)"
          npm pack --json --pack-destination "${packdir}" > "${packdir}/pack.json"
          integrity="$(node -p "Object.values(require('${packdir}/pack.json'))[0].integrity")"
          published="$(npm view "@clawdbuilder/jig@${version}" dist.integrity 2>/dev/null || true)"
          if [ -n "${published}" ]; then
            if [ "${published}" != "${integrity}" ]; then
              echo "::error::@clawdbuilder/jig@${version} is already on npm with different content"
              echo "tag integrity: ${integrity}"
              echo "npm integrity: ${published}"
              exit 1
            fi
            echo "@clawdbuilder/jig@${version} is already published with this content; nothing to publish"
          else
            npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
            npm publish --provenance --access public
          fi
          # npm may take many minutes to show a new version. Wait up to 30 minutes, and say so while waiting; a failure
          # still names what npm last reported. Re-running is safe: an already-published version skips the publish.
          got=""
          for attempt in $(seq 1 900); do
            got="$(npm view "@clawdbuilder/jig@${version}" version 2>/dev/null || true)"
            [ "${got}" = "${version}" ] && break
            if [ $((attempt % 10)) -eq 1 ]; then
              echo "waiting for npm to report @clawdbuilder/jig@${version} (last: ${got:-not found}); attempt ${attempt}/900"
            fi
            sleep 2
          done
          if [ "${got}" != "${version}" ]; then
            echo "::error::npm does not report @clawdbuilder/jig@${version} after 30 minutes (last: ${got:-not found}); the publish may have succeeded, so re-run this job"
            exit 1
          fi

      # Running this again is safe: a tag whose release exists is edited, not refused. A page published by hand for an older
      # tag does not become the latest release, which belongs to the newest tag.
      - name: Write the release
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          node scripts/release-notes.mjs "${TAG#v}" > "${notes}"
          latest=()
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            latest=(--latest=false)
          fi
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file "${notes}"
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file "${notes}" "${latest[@]}"
          fi

