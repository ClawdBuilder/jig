<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="190" viewBox="0 0 1080 190" role="img" aria-label="A logs call becomes buckets; the adapter builds one request per bucket; the backend answers with a page of hits; production hit lines are masked before the agent reads them." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}.glyph{fill:#7aa2f7}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="189" rx="12"/>
  <rect class="node" x="25" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M90 75 h6 v16 h-6 M100 79 h16 M100 84 h10 M100 89 h13 M100 94 h8"/>
  <text class="label" x="105" y="115" text-anchor="middle">call</text>
  <text class="sub" x="105" y="132" text-anchor="middle">phrase · window</text>

  <rect class="node" x="230" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M290 77 h18 v16 h-18 z M290 82 h18 M295 73 v6 M303 73 v6"/>
  <text class="label" x="310" y="115" text-anchor="middle">buckets</text>
  <text class="sub" x="310" y="132" text-anchor="middle">split</text>

  <rect class="node" x="435" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M495 75 h20 v7 l-10 6 -10 -6 z M495 88 v8 M515 88 v8"/>
  <text class="label" x="515" y="115" text-anchor="middle">request</text>
  <text class="sub" x="515" y="132" text-anchor="middle">adapter</text>

  <rect class="node" x="640" y="60" width="160" height="80" rx="12"/>
  <ellipse class="accent" cx="710" cy="78" rx="8" ry="3.5"/><path class="accent" d="M702 78 v12 c0 2.5 3.5 4.5 8 4.5 s8 -2 8 -4.5 v-12"/>
  <text class="label" x="720" y="115" text-anchor="middle">backend</text>
  <text class="sub" x="720" y="132" text-anchor="middle">page</text>

  <rect class="node" x="845" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M905 75 h18 v18 h-18 z M910 81 h8 M910 87 h8 M910 93 h5"/>
  <text class="label" x="925" y="115" text-anchor="middle">hits</text>
  <text class="sub" x="925" y="132" text-anchor="middle">cut</text>

  <path class="path" d="M185 100 H230"/><path id="logssearch-arrow-1" class="arrowhead" d="M222 95 L230 100 L222 105 z"/>
  <path class="path" d="M390 100 H435"/><path id="logssearch-arrow-2" class="arrowhead" d="M427 95 L435 100 L427 105 z"/>
  <path class="path" d="M595 100 H640"/><path id="logssearch-arrow-3" class="arrowhead" d="M632 95 L640 100 L632 105 z"/>
  <path class="path" d="M800 100 H845"/><path id="logssearch-arrow-4" class="arrowhead" d="M837 95 L845 100 L837 105 z"/>
  <circle class="marker" cx="822" cy="100" r="11"/><path class="accent" d="M822 94 l4 1 v3 c0 3 -2 5 -4 6 c-2 -1 -4 -3 -4 -6 v-3 z"/>
  <text class="sub" x="822" y="78" text-anchor="middle">mask</text>
</svg>
