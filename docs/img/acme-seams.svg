<svg xmlns="http://www.w3.org/2000/svg" width="744" height="326" viewBox="0 2 744 326" role="img" aria-label="A company plugin in three steps: one of its files makes one call on jig-core's global handle, withJig, and something in Jig reads the result. What a file adds is one seam, such as environments, a sign-in, masking or a status line, and each seam is one file. The plugin holds configuration and knowledge, and changes no tool's behaviour." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    .spoke { fill: none; stroke: #5c626b; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .chip { fill: #18181b; stroke: #2c2c31; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
      .spoke { stroke: #9a9aa2; }
    }
  </style>
  <rect class="bg" x="0.5" y="2.5" width="743" height="325" rx="12"/>

  <!-- the file, the handle, the reader -->
  <rect class="node" x="24" y="120" width="150" height="90" rx="12"/>
  <path class="accent" d="M91 130 h16 a3 3 0 0 1 3 3 v24 a3 3 0 0 1 -3 3 h-16 a3 3 0 0 1 -3 -3 v-24 a3 3 0 0 1 3 -3 z"/>
  <path class="accent" d="M95 137 h16 M95 144 h16 M95 151 h10"/>
  <text class="label" x="99" y="182" text-anchor="middle">your files</text>
  <text class="sub" x="99" y="200" text-anchor="middle">one per seam</text>

  <rect class="node" x="240" y="120" width="280" height="90" rx="12"/>
  <path class="accent" d="M369 137 l-6 7 6 7 M391 137 l6 7 -6 7"/>
  <text class="label" x="380" y="182" text-anchor="middle">withJig</text>
  <text class="sub" x="380" y="200" text-anchor="middle">jig-core's global handle</text>

  <rect class="node" x="570" y="120" width="150" height="90" rx="12"/>
  <rect class="accent" x="626" y="132" width="13" height="13" rx="2"/>
  <rect class="accent" x="643" y="132" width="13" height="13" rx="2"/>
  <rect class="accent" x="634" y="148" width="13" height="13" rx="2"/>
  <text class="label" x="645" y="182" text-anchor="middle">Jig</text>
  <text class="sub" x="645" y="200" text-anchor="middle">reads it</text>

  <path class="path" d="M174 165 H240"/>
  <path id="acmeseams55-arrow-call" class="arrowhead" d="M232 160 L240 165 L232 170 z"/>
  <text class="edge" x="207" y="155" text-anchor="middle">calls</text>
  <path class="path" d="M520 165 H570"/>
  <path id="acmeseams55-arrow-read" class="arrowhead" d="M562 160 L570 165 L562 170 z"/>
  <text class="edge" x="545" y="155" text-anchor="middle">reads</text>

  <!-- one seam is one file: the kinds around the handle -->
  <rect class="chip" x="230" y="26" width="150" height="40" rx="10"/>
  <path class="accent" d="M250 37 l11 5 -11 5 -11 -5 z"/>
  <path class="accent" d="M239 46 l11 5 11 -5"/>
  <path class="accent" d="M239 51 l11 5 11 -5"/>
  <text class="label" x="268" y="51">environments</text>
  <path class="spoke" d="M305 66 V120"/>

  <rect class="chip" x="390" y="26" width="120" height="40" rx="10"/>
  <circle class="accent" cx="410" cy="46" r="7"/>
  <circle class="accent" cx="407.5" cy="46" r="2.2"/>
  <path class="accent" d="M409.7 46 H417 M414 46 v2.4 M417 46 v1.6"/>
  <text class="label" x="428" y="51">sign-in</text>
  <path class="spoke" d="M450 66 V120"/>

  <rect class="chip" x="230" y="264" width="130" height="40" rx="10"/>
  <circle class="accent" cx="250" cy="284" r="7"/>
  <path class="accent" d="M243 284 q7 -6 14 0 q-7 6 -14 0 z"/>
  <circle class="accent" cx="250" cy="284" r="2.2"/>
  <path class="accent" d="M243 292 L257 276"/>
  <text class="label" x="268" y="289">masking</text>
  <path class="spoke" d="M295 264 V210"/>

  <rect class="chip" x="390" y="264" width="110" height="40" rx="10"/>
  <path class="accent" d="M397 284 h5 l3 -6 4 12 3 -6 h6"/>
  <text class="label" x="428" y="289">status</text>
  <path class="spoke" d="M445 264 V210"/>
</svg>
