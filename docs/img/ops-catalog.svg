<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="One service catalog, describing each service once, feeds the three jig-ops tools: ci for builds and watches, deploy for rollouts, and runtime for pods. Each tool has its own adapters described on the page." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.catalog{fill:#eef4ff;stroke:#2563eb;stroke-width:1.6}
    .label{fill:#1a1b1e;font-size:15px;font-weight:700}.sub{fill:#5c626b;font-size:11px}
    .accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.catalog{fill:#15203b;stroke:#7aa2f7}
      .label{fill:#e7e7ea}.sub{fill:#9a9aa2}.accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="319" rx="12"/>
  <rect class="catalog" x="330" y="30" width="240" height="80" rx="12"/>
  <path class="accent" d="M410 42 h24 v22 h-24 z M416 48 h12 M416 54 h12 M416 60 h8"/>
  <text class="label" x="450" y="88" text-anchor="middle">catalog</text>
  <text class="sub" x="450" y="103" text-anchor="middle">one service</text>

  <rect class="node" x="55" y="190" width="230" height="90" rx="12"/>
  <path class="accent" d="M145 205 h24 v8 h-24 z M145 217 h24 v8 h-24 z M150 209 h8 M150 221 h8"/>
  <text class="label" x="170" y="250" text-anchor="middle">ci</text>
  <text class="sub" x="170" y="266" text-anchor="middle">builds</text>

  <rect class="node" x="335" y="190" width="230" height="90" rx="12"/>
  <path class="accent" d="M425 205 l16 9 -16 9 z M420 205 v18"/>
  <text class="label" x="450" y="250" text-anchor="middle">deploy</text>
  <text class="sub" x="450" y="266" text-anchor="middle">rollouts</text>

  <rect class="node" x="615" y="190" width="230" height="90" rx="12"/>
  <path class="accent" d="M720 204 l10 -6 10 6 v12 l-10 6 -10 -6 z M720 204 l10 6 10 -6 M730 210 v12"/>
  <text class="label" x="730" y="250" text-anchor="middle">runtime</text>
  <text class="sub" x="730" y="266" text-anchor="middle">pods</text>

  <path class="path" d="M390 110 V150 H170 V190"/><path id="opscatalog-arrow-1" class="arrowhead" d="M165 182 L170 190 L175 182 z"/>
  <path class="path" d="M450 110 V190"/><path id="opscatalog-arrow-2" class="arrowhead" d="M445 182 L450 190 L455 182 z"/>
  <path class="path" d="M510 110 V150 H730 V190"/><path id="opscatalog-arrow-3" class="arrowhead" d="M725 182 L730 190 L735 182 z"/>
</svg>
