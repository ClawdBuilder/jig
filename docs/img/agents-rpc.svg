<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="242" viewBox="6 36 1028 242" role="img" aria-label="How jig-agents runs a child: the agent calls subagent start; jig-agents starts a separate Pi in RPC mode and holds the pipe to it; the child loads the same plugins, so jig-core governs its tools and jig-sandbox its bash; jig-agents sends it the task and counts its turns, minutes and cost; when the child's rules say ask, the question comes to you through the parent and your answer goes back; and its report reaches the agent as a message." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .marker-ring { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    .you-ring { fill: #ffffff; stroke: #b05a8a; stroke-width: 1.5; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .you { fill: #b05a8a; }
    .dot { fill: #2563eb; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    .back { fill: none; stroke: #b05a8a; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .back-head { fill: #b05a8a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .marker-ring { fill: #18181b; stroke: #7aa2f7; }
      .you-ring { fill: #18181b; stroke: #d98ab8; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .you { fill: #d98ab8; }
      .dot { fill: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
      .back { stroke: #d98ab8; }
      .back-head { fill: #d98ab8; }
    }
  </style>
  <rect class="bg" x="6.5" y="36.5" width="1027" height="241" rx="12"/>

  <!-- 1. subagent start -->
  <rect class="node" x="30" y="60" width="170" height="90" rx="12"/>
  <circle class="accent" cx="115" cy="78" r="13"/>
  <path class="accent" d="M111 71 l10 7 -10 7 z"/>
  <text class="label" x="115" y="122" text-anchor="middle">subagent start</text>
  <text class="sub" x="115" y="140" text-anchor="middle">a role and a task</text>

  <!-- 2. jig-agents in the parent -->
  <rect class="node" x="300" y="60" width="170" height="90" rx="12"/>
  <circle class="accent" cx="372" cy="76" r="4"/>
  <circle class="accent" cx="400" cy="76" r="4"/>
  <circle class="accent" cx="386" cy="92" r="4"/>
  <path class="accent" d="M372 80 L384 89 M400 80 L388 89"/>
  <text class="label" x="385" y="122" text-anchor="middle">jig-agents</text>
  <text class="sub" x="385" y="140" text-anchor="middle">one pipe</text>

  <!-- 3. the child Pi -->
  <rect class="node" x="570" y="60" width="170" height="90" rx="12"/>
  <rect class="accent" x="642" y="66" width="28" height="22" rx="3"/>
  <path class="accent" d="M647 73 l4 4 -4 4 M655 81 h6"/>
  <text class="label" x="655" y="122" text-anchor="middle">child Pi</text>
  <text class="sub" x="655" y="140" text-anchor="middle">same plugins</text>

  <!-- 4. the report -->
  <rect class="node" x="840" y="60" width="170" height="90" rx="12"/>
  <path class="accent" d="M910 68 H950 V88 H926 l-8 8 v-8 h-8 z"/>
  <path class="accent" d="M916 76 H944 M916 82 H934"/>
  <text class="label" x="925" y="122" text-anchor="middle">report</text>
  <text class="sub" x="925" y="140" text-anchor="middle">as a message</text>

  <!-- the path -->
  <path class="path" d="M200 105 H300"/>
  <path id="agentsrpc55-arrow-agents" class="arrowhead" d="M292 100 L300 105 L292 110 z"/>
  <path class="path" d="M470 105 H570"/>
  <path id="agentsrpc55-arrow-child" class="arrowhead" d="M562 100 L570 105 L562 110 z"/>
  <path class="path" d="M740 105 H840"/>
  <path id="agentsrpc55-arrow-report" class="arrowhead" d="M832 100 L840 105 L832 110 z"/>

  <!-- what moves on the pipe: the task, and the limits jig-agents counts -->
  <circle class="marker-ring" cx="520" cy="105" r="12"/>
  <rect class="accent" x="512" y="97" width="16" height="18" rx="2"/>
  <path class="accent" d="M516 95 h8 M515 103 h10 M515 109 h7"/>
  <text class="muted" x="520" y="133" text-anchor="middle">task</text>
  <circle class="marker-ring" cx="790" cy="105" r="12"/>
  <circle class="accent" cx="790" cy="105" r="8"/>
  <path class="accent" d="M790 105 V100 M790 105 l3 3"/>
  <text class="muted" x="790" y="133" text-anchor="middle">limits</text>

  <!-- the child's question comes to you, and your answer goes back -->
  <path class="path" d="M612 150 V208"/>
  <path id="agentsrpc55-arrow-question" class="arrowhead" d="M607 200 L612 208 L617 200 z"/>
  <text class="edge" x="596" y="186" text-anchor="end">question</text>
  <rect class="node" x="540" y="210" width="144" height="44" rx="12"/>
  <circle class="you-ring" cx="562" cy="232" r="10"/>
  <circle class="you" cx="562" cy="229" r="2.8"/>
  <path class="you" d="M556.5 237.4 Q556.5 232 562 232 Q567.5 232 567.5 237.4 Z"/>
  <text class="label" x="580" y="237">you</text>
  <path class="back" d="M660 208 V150"/>
  <path id="agentsrpc55-arrow-answer" class="back-head" d="M655 158 L660 150 L665 158 z"/>
  <text class="edge" x="676" y="186">answer</text>
</svg>
