<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="334" viewBox="6 8 1128 334" role="img" aria-label="What the harness regulates around a ticket: four dimensions, maintainability, compatibility, behaviour and data safety, each with guides before the agent acts and sensors after it does. The guides are AGENTS.md and skills; an approved plan and related tickets; scenarios in the plan and the workflow gates; approved fields and the floor. The sensors are diff rules and a checker agent; compile and the affected tests; the tests at HEAD, the scenario results and you in acceptance; masking and redaction. Behaviour is highlighted because it is the hardest to sense, and the dashed items are planned." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .chip { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip-later { fill: #ffffff; stroke: #5c626b; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .head { fill: #5c626b; font-size: 12px; font-weight: 700; }
    .head-on { fill: #2563eb; font-size: 12px; font-weight: 700; }
    .row { fill: #5c626b; font-size: 12px; font-weight: 700; }
    .small { fill: #1a1b1e; font-size: 12px; }
    .rule { fill: none; stroke: #d9dde3; stroke-width: 1; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .chip { fill: #18181b; stroke: #2c2c31; }
      .chip-later { fill: #111113; stroke: #9a9aa2; }
      .head { fill: #9a9aa2; }
      .head-on { fill: #7aa2f7; }
      .row { fill: #9a9aa2; }
      .small { fill: #e7e7ea; }
      .rule { stroke: #2c2c31; }
      .accent { stroke: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="6.5" y="8.5" width="1127" height="333" rx="12"/>

  <!-- the four dimensions -->
  <text class="head" x="280" y="44" text-anchor="middle">maintainability</text>
  <text class="head" x="520" y="44" text-anchor="middle">compatibility</text>
  <text class="head-on" x="760" y="44" text-anchor="middle">behaviour</text>
  <path class="accent" d="M733 52 H787"/>
  <text class="head" x="1000" y="44" text-anchor="middle">data safety</text>

  <!-- guides -->
  <text class="row" x="30" y="110">guides</text>
  <rect class="chip" x="170" y="86" width="220" height="32" rx="8"/>
  <text class="small" x="280" y="107" text-anchor="middle">AGENTS.md</text>
  <rect class="chip" x="170" y="126" width="220" height="32" rx="8"/>
  <text class="small" x="280" y="147" text-anchor="middle">skills</text>

  <rect class="chip" x="410" y="86" width="220" height="32" rx="8"/>
  <text class="small" x="520" y="107" text-anchor="middle">approved plan</text>
  <rect class="chip-later" x="410" y="126" width="220" height="32" rx="8"/>
  <text class="small" x="520" y="147" text-anchor="middle">related tickets</text>

  <rect class="chip" x="650" y="86" width="220" height="32" rx="8"/>
  <text class="small" x="760" y="107" text-anchor="middle">scenarios in plan</text>
  <rect class="chip" x="650" y="126" width="220" height="32" rx="8"/>
  <text class="small" x="760" y="147" text-anchor="middle">workflow gates</text>

  <rect class="chip" x="890" y="86" width="220" height="32" rx="8"/>
  <text class="small" x="1000" y="107" text-anchor="middle">approved fields</text>
  <rect class="chip" x="890" y="126" width="220" height="32" rx="8"/>
  <text class="small" x="1000" y="147" text-anchor="middle">the floor</text>

  <path class="rule" d="M30 180 H1130"/>

  <!-- sensors -->
  <text class="row" x="30" y="232">sensors</text>
  <rect class="chip-later" x="170" y="206" width="220" height="32" rx="8"/>
  <text class="small" x="280" y="227" text-anchor="middle">diff rules</text>
  <rect class="chip-later" x="170" y="246" width="220" height="32" rx="8"/>
  <text class="small" x="280" y="267" text-anchor="middle">checker agent</text>

  <rect class="chip-later" x="410" y="206" width="220" height="32" rx="8"/>
  <text class="small" x="520" y="227" text-anchor="middle">compile</text>
  <rect class="chip-later" x="410" y="246" width="220" height="32" rx="8"/>
  <text class="small" x="520" y="267" text-anchor="middle">affected tests</text>

  <rect class="chip" x="650" y="206" width="220" height="32" rx="8"/>
  <text class="small" x="760" y="227" text-anchor="middle">tests at HEAD</text>
  <rect class="chip" x="650" y="246" width="220" height="32" rx="8"/>
  <text class="small" x="760" y="267" text-anchor="middle">scenario results</text>
  <rect class="chip" x="650" y="286" width="220" height="32" rx="8"/>
  <text class="small" x="760" y="307" text-anchor="middle">you in acceptance</text>

  <rect class="chip" x="890" y="206" width="220" height="32" rx="8"/>
  <text class="small" x="1000" y="227" text-anchor="middle">masking</text>
  <rect class="chip" x="890" y="246" width="220" height="32" rx="8"/>
  <text class="small" x="1000" y="267" text-anchor="middle">redaction</text>
</svg>
