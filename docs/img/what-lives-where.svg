<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-label="Layers from the bottom up: Pi and its built-in tools, which are Pi's own; jig-core and the generic plugins, which are public Jig; and the company's private plugin on top." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.layer{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.company{fill:#eef4ff;stroke:#2563eb;stroke-width:1.6}
    .label{fill:#1a1b1e;font-size:15px;font-weight:700}.small{fill:#5c626b;font-size:11px}
    .accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}
    .chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.layer{fill:#18181b;stroke:#2c2c31}.company{fill:#15203b;stroke:#7aa2f7}
      .label{fill:#e7e7ea}.small{fill:#9a9aa2}.accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}
      .chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="979" height="379" rx="12"/>
  <path class="path" d="M52 128 H36 V262 H52"/>
  <text class="small" x="58" y="199">Jig, public</text>
  <text class="small" x="40" y="314">Pi's own</text>

  <rect class="company" x="130" y="52" width="810" height="58" rx="12"/>
  <text class="label" x="160" y="86">company</text>
  <text class="small" x="300" y="86">environments · sign-in · internal tools · knowledge</text>
  <rect class="chip" x="760" y="64" width="128" height="24" rx="12"/><text class="chip-text" x="824" y="80" text-anchor="middle">private</text>
  <rect class="layer" x="130" y="128" width="810" height="58" rx="12"/>
  <text class="label" x="160" y="162">plugins</text>
  <text class="small" x="300" y="162">generic tools · other package tools</text>
  <rect class="layer" x="130" y="204" width="810" height="58" rx="12"/>
  <text class="label" x="160" y="238">jig-core</text>
  <text class="small" x="300" y="238">classify · rules · mask · record</text>
  <rect class="layer" x="130" y="280" width="810" height="58" rx="12"/>
  <text class="label" x="160" y="314">Pi</text>
  <text class="small" x="300" y="314">read · write · edit · bash · ls · find · grep</text>
</svg>
