<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="138" viewBox="6 31 1058 138" role="img" aria-label="Jig's memory in five steps: while a ticket is open the agent writes notes and evidence into the ticket's folder; at close it writes a card, and the plugin adds the card's shared keys to an index of past cards; when a later ticket starts, recall matches that ticket's keys and words against the cards and hands the best ones back as a short message. The rules that cross every step, protect every write, keep it small and measure recall first, are in jig-memory's README." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .marker-ring { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .glyph { fill: #2563eb; font-size: 12px; font-weight: 700; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #2563eb; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .marker-ring { fill: #18181b; stroke: #7aa2f7; }
      .label { fill: #e7e7ea; }
      .glyph { fill: #7aa2f7; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .dot { fill: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="6.5" y="31.5" width="1057" height="137" rx="12"/>

  <!-- 1. write the notes and the evidence -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="94" y="63" width="24" height="30" rx="3"/>
  <path class="accent" d="M100 71 H112 M100 78 H112 M100 85 H107"/>
  <path class="accent" d="M112 93 l14 -14 l5 5 l-14 14 l-6 1 z"/>
  <text class="label" x="115" y="125" text-anchor="middle">write</text>

  <!-- 2. the card at close -->
  <rect class="node" x="240" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="304" y="63" width="32" height="30" rx="3"/>
  <path class="accent" d="M310 70 H330 M310 76 H330 M310 82 H318"/>
  <text class="label" x="325" y="125" text-anchor="middle">card</text>

  <!-- 3. the index of past cards -->
  <rect class="node" x="450" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M524 68 l-5 20 M542 68 l-5 20 M514 74 h30 M511 82 h30"/>
  <text class="label" x="535" y="125" text-anchor="middle">index</text>

  <!-- 4. recall when a later ticket starts -->
  <rect class="node" x="660" y="55" width="170" height="90" rx="12"/>
  <circle class="accent" cx="740" cy="75" r="10"/>
  <path class="accent" d="M747 82 l9 9"/>
  <text class="label" x="745" y="125" text-anchor="middle">recall</text>

  <!-- 5. the short message the agent gets -->
  <rect class="node" x="870" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M930 64 H980 V84 H946 l-8 8 v-8 h-8 z"/>
  <path class="accent" d="M938 72 H972 M938 78 H962"/>
  <text class="label" x="955" y="125" text-anchor="middle">message</text>

  <!-- the path, with an arrowhead entering each node -->
  <path class="path" d="M200 100 H240"/>
  <path id="memsteps55-arrow-card" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H450"/>
  <path id="memsteps55-arrow-index" class="arrowhead" d="M442 95 L450 100 L442 105 z"/>
  <path class="path" d="M620 100 H660"/>
  <path id="memsteps55-arrow-recall" class="arrowhead" d="M652 95 L660 100 L652 105 z"/>
  <path class="path" d="M830 100 H870"/>
  <path id="memsteps55-arrow-message" class="arrowhead" d="M862 95 L870 100 L862 105 z"/>
  <text class="edge" x="220" y="89" text-anchor="middle">at close</text>
  <text class="edge" x="640" y="89" text-anchor="middle">at start</text>

  <!-- the card's shared keys are what link an old ticket to a new one -->
  <circle class="marker-ring" cx="430" cy="100" r="12"/>
  <circle class="accent" cx="423" cy="100" r="3.2"/>
  <path class="accent" d="M426.2 100 H438 M434.4 100 v3.6 M438 100 v2.4"/>
  <text class="muted" x="430" y="128" text-anchor="middle">keys</text>
</svg>
