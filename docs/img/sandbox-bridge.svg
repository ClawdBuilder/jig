<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250" role="img" aria-label="A later command reaches a background task's server in filtered or ask network mode: the command's network holds a socat forwarder, which asks the sandbox proxy, which asks the broker callback; only a carried port is allowed, and the bridge listener on this machine reaches the task's server." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}.chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}
      .glyph{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="249" rx="12"/>
  <rect class="node" x="25" y="70" width="160" height="90" rx="12"/>
  <path class="accent" d="M95 86 h18 v20 h-18 z M100 92 h8 M100 98 h8 M100 104 h5"/>
  <text class="label" x="105" y="125" text-anchor="middle">server</text>
  <text class="sub" x="105" y="143" text-anchor="middle">task network</text>

  <rect class="node" x="230" y="70" width="160" height="90" rx="12"/>
  <path class="accent" d="M300 86 l12 9 -12 9 z M290 86 v18"/>
  <text class="label" x="310" y="125" text-anchor="middle">socat</text>
  <text class="sub" x="310" y="143" text-anchor="middle">forwarder</text>

  <rect class="node" x="435" y="70" width="160" height="90" rx="12"/>
  <path class="accent" d="M500 86 l16 0 8 8 -8 8 -16 0 z M520 90 l4 4 -4 4"/>
  <text class="label" x="515" y="125" text-anchor="middle">proxy</text>
  <text class="sub" x="515" y="143" text-anchor="middle">sandbox</text>

  <rect class="node" x="640" y="70" width="160" height="90" rx="12"/>
  <path class="accent" d="M710 86 h20 v18 h-20 z M716 92 h8 M716 98 h8"/>
  <text class="label" x="720" y="125" text-anchor="middle">broker</text>
  <text class="sub" x="720" y="143" text-anchor="middle">callback</text>

  <rect class="node" x="845" y="70" width="160" height="90" rx="12"/>
  <path class="accent" d="M910 88 v14 M900 96 h20 M900 104 h20"/>
  <text class="label" x="925" y="125" text-anchor="middle">bridge</text>
  <text class="sub" x="925" y="143" text-anchor="middle">this machine</text>

  <path class="path" d="M185 115 H230"/><path id="bridge-a1-arrow-1" class="arrowhead" d="M222 110 L230 115 L222 120 z"/>
  <path class="path" d="M390 115 H435"/><path id="bridge-a1-arrow-2" class="arrowhead" d="M427 110 L435 115 L427 120 z"/>
  <path class="path" d="M595 115 H640"/><path id="bridge-a1-arrow-3" class="arrowhead" d="M632 110 L640 115 L632 120 z"/>
  <path class="path" d="M800 115 H845"/><path id="bridge-a1-arrow-4" class="arrowhead" d="M837 110 L845 115 L837 120 z"/>
  <circle class="marker" cx="690" cy="52" r="12"/><text class="glyph" x="690" y="56" text-anchor="middle">?</text>
  <text class="sub" x="690" y="35" text-anchor="middle">port</text>
  <path class="path" d="M1005 115 H1015"/><path id="bridge-a1-arrow-5" class="arrowhead" d="M1007 110 L1015 115 L1007 120 z"/>
  <rect class="chip" x="1015" y="102" width="55" height="26" rx="13"/><text class="chip-text" x="1042" y="119" text-anchor="middle">reach</text>
</svg>
