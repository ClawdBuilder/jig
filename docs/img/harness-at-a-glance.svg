<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="The Jig harness: guides feed Pi before it acts; sensors feed back after it acts; you steer by changing both. The loop repeats on the next turn." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}
    .label{fill:#1a1b1e;font-size:14px;font-weight:700}.sub{fill:#5c626b;font-size:11px}
    .accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}
    .marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}.glyph{fill:#2563eb;font-size:12px;font-weight:700}
    .chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:12px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}
      .marker{fill:#18181b;stroke:#7aa2f7}.glyph{fill:#7aa2f7}
      .chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="249" rx="12"/>
  <rect class="node" x="30" y="70" width="170" height="90" rx="12"/>
  <path class="accent" d="M97 88 h26 v8 h-20 v12 h20 v8 h-26 z"/>
  <text class="label" x="115" y="132" text-anchor="middle">guides</text>
  <text class="sub" x="115" y="148" text-anchor="middle">skills and rules</text>

  <rect class="node" x="250" y="70" width="170" height="90" rx="12"/>
  <path class="accent" d="M325 88 l16 6 -16 6 z M325 104 h18 M325 112 h14"/>
  <text class="label" x="335" y="132" text-anchor="middle">Pi</text>
  <text class="sub" x="335" y="148" text-anchor="middle">the coding agent</text>

  <rect class="node" x="470" y="70" width="170" height="90" rx="12"/>
  <path class="accent" d="M545 98 q10 -9 20 0 q-10 9 -20 0 M555 98 a3 3 0 1 0 0.1 0"/>
  <text class="label" x="555" y="132" text-anchor="middle">sensors</text>
  <text class="sub" x="555" y="148" text-anchor="middle">tests and reviews</text>

  <rect class="node" x="690" y="70" width="170" height="90" rx="12"/>
  <circle class="accent" cx="775" cy="84" r="7"/><path class="accent" d="M775 93 v18 M766 100 h18 M775 111 l-7 9 M775 111 l7 9"/>
  <text class="label" x="775" y="132" text-anchor="middle">you</text>
  <text class="sub" x="775" y="148" text-anchor="middle">steer both</text>

  <path class="path" d="M200 115 H250"/><path id="harness-a1-arrow-1" class="arrowhead" d="M242 110 L250 115 L242 120 z"/>
  <path class="path" d="M420 115 H470"/><path id="harness-a1-arrow-2" class="arrowhead" d="M462 110 L470 115 L462 120 z"/>
  <path class="path" d="M640 115 H690"/><path id="harness-a1-arrow-3" class="arrowhead" d="M682 110 L690 115 L682 120 z"/>
  <path class="path" d="M775 160 V205 H775" fill="none" stroke-dasharray="4 4"/>
  <path class="path" d="M775 205 H115 V160" fill="none" stroke-dasharray="4 4"/>
  <path id="harness-a1-arrow-4" class="arrowhead" d="M110 170 L115 160 L120 170 z"/>
  <circle class="marker" cx="445" cy="205" r="12"/><text class="glyph" x="445" y="209" text-anchor="middle">↺</text>
  <text class="sub" x="445" y="230" text-anchor="middle">next turn</text>
</svg>
