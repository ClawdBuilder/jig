<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="A palette sheet for jig-theme. Seventeen named colours, bg, panel, selected, errorBg, text, soft, muted, dim, border, borderMuted, accent, link, heading, info, success, warning and error, feed one theme used by Pi settings, the theme command and the HTML export. Your own palette in jig.json names a built-in base, changes a few vars and colors, and becomes a theme file in Pi's agent folder." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#ffffff}.panel{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.code{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.sample{fill:#0E1520}
    .title{fill:#1a1b1e;font-size:15px;font-weight:700}.label{fill:#1a1b1e;font-size:12px}.small{fill:#5c626b;font-size:11px}
    .accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#2563eb}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#1a1b1e}
    .chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:10px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.panel{fill:#18181b;stroke:#2c2c31}.code{fill:#18181b;stroke:#2c2c31}
      .title{fill:#e7e7ea}.label{fill:#e7e7ea}.small{fill:#9a9aa2}.mono{fill:#e7e7ea}
      .accent{stroke:#7aa2f7}.arrow{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="919" height="499" rx="12"/>
  <text class="title" x="32" y="34">palette</text>
  <text class="small" x="32" y="51">17 tokens</text>

  <rect x="32" y="70" width="22" height="22" rx="5" fill="#0E1520" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="86">bg</text>
  <rect x="200" y="70" width="22" height="22" rx="5" fill="#111C2A" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="86">panel</text>
  <rect x="368" y="70" width="22" height="22" rx="5" fill="#1B2A3D" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="398" y="86">selected</text>
  <rect x="32" y="106" width="22" height="22" rx="5" fill="#241820" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="122">errorBg</text>
  <rect x="200" y="106" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="122">text</text>
  <rect x="368" y="106" width="22" height="22" rx="5" fill="#D8E1EA" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="398" y="122">soft</text>
  <rect x="32" y="142" width="22" height="22" rx="5" fill="#8292A6" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="158">muted</text>
  <rect x="200" y="142" width="22" height="22" rx="5" fill="#586779" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="158">dim</text>
  <rect x="368" y="142" width="22" height="22" rx="5" fill="#273344" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="398" y="158">border</text>
  <rect x="32" y="178" width="22" height="22" rx="5" fill="#1D2734" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="194">borderMuted</text>
  <rect x="200" y="178" width="22" height="22" rx="5" fill="#55DDE0" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="194">accent</text>
  <rect x="368" y="178" width="22" height="22" rx="5" fill="#55DDE0" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="398" y="194">link</text>
  <rect x="32" y="214" width="22" height="22" rx="5" fill="#C099FF" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="230">heading</text>
  <rect x="200" y="214" width="22" height="22" rx="5" fill="#78A9FF" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="230">info</text>
  <rect x="368" y="214" width="22" height="22" rx="5" fill="#7BD88F" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="398" y="230">success</text>
  <rect x="32" y="250" width="22" height="22" rx="5" fill="#FFB454" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="62" y="266">warning</text>
  <rect x="200" y="250" width="22" height="22" rx="5" fill="#FF6B7A" stroke="#1a1b1e" stroke-opacity=".25"/><text class="label" x="230" y="266">error</text>

  <rect class="sample" x="520" y="60" width="368" height="220" rx="10"/>
  <text class="title" x="540" y="88" style="fill:#FFFFFF">theme</text>
  <text class="label" x="540" y="120" style="fill:#C099FF">heading</text>
  <text class="label" x="540" y="142" style="fill:#FFFFFF">text</text>
  <text class="mono" x="540" y="164" style="fill:#FFB454">code</text>
  <text class="label" x="540" y="186" style="fill:#55DDE0">link</text>
  <text class="label" x="540" y="208" style="fill:#7BD88F">added</text>
  <text class="label" x="540" y="230" style="fill:#FF6B7A">removed</text>
  <text class="small" x="540" y="252" style="fill:#586779">comment</text>
  <text class="label" x="650" y="120" style="fill:#78A9FF">tool</text>
  <rect class="chip" x="650" y="132" width="62" height="20" rx="10"/><text class="chip-text" x="681" y="146" text-anchor="middle">settings</text>
  <rect class="chip" x="720" y="132" width="48" height="20" rx="10"/><text class="chip-text" x="744" y="146" text-anchor="middle">theme</text>
  <rect class="chip" x="776" y="132" width="78" height="20" rx="10"/><text class="chip-text" x="815" y="146" text-anchor="middle">HTML</text>
  <path class="accent" d="M460 170 H520"/><path class="arrow" d="M512 165 L520 170 L512 175 z"/>

  <text class="title" x="32" y="310">your palette</text>
  <rect class="code" x="32" y="328" width="380" height="140" rx="8"/>
  <text class="mono" x="48" y="352">base jig-signal</text>
  <text class="mono" x="48" y="376">vars accent</text>
  <text class="mono" x="48" y="400">colors mdCode</text>
  <path class="accent" d="M412 400 H540"/><path class="arrow" d="M532 395 L540 400 L532 405 z"/>
  <rect class="panel" x="540" y="328" width="348" height="140" rx="10"/>
  <text class="title" x="560" y="360">theme file</text>
  <text class="small" x="560" y="384">agent folder</text>
  <text class="small" x="560" y="404">Pi theme</text>
</svg>
