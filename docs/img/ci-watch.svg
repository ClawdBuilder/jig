<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="190" viewBox="0 0 1080 190" role="img" aria-label="A push or ci watch starts a watch; the watch polls the CI system every thirty seconds until its finish line; one message then wakes the agent's next turn." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}.chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}
      .glyph{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="189" rx="12"/>
  <rect class="node" x="25" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M95 75 v10 M95 85 l-10 10 M95 85 l10 10 M85 95 v8 M105 95 v8"/>
  <text class="label" x="105" y="125" text-anchor="middle">push</text>
  <text class="sub" x="105" y="140" text-anchor="middle">git</text>

  <rect class="node" x="230" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M300 75 q12 9 0 18 q-12 -9 0 -18 M300 79 v10"/>
  <text class="label" x="310" y="125" text-anchor="middle">watch</text>
  <text class="sub" x="310" y="140" text-anchor="middle">jig-ops</text>

  <rect class="node" x="435" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M505 75 h18 v7 h-18 z M505 86 h18 v7 h-18 z M509 82 h10 M509 89 h10"/>
  <text class="label" x="515" y="125" text-anchor="middle">CI</text>
  <text class="sub" x="515" y="140" text-anchor="middle">service</text>

  <rect class="node" x="640" y="60" width="160" height="80" rx="12"/>
  <path class="accent" d="M710 75 v18 M710 75 h14 M710 84 h10"/>
  <text class="label" x="720" y="125" text-anchor="middle">finish</text>
  <text class="sub" x="720" y="140" text-anchor="middle">line</text>

  <rect class="node" x="845" y="60" width="160" height="80" rx="12"/>
  <circle class="accent" cx="925" cy="80" r="7"/><path class="accent" d="M925 89 v15 M915 96 h20 M925 104 l-7 9 M925 104 l7 9"/>
  <text class="label" x="925" y="125" text-anchor="middle">agent</text>
  <text class="sub" x="925" y="140" text-anchor="middle">next turn</text>

  <path class="path" d="M185 100 H230"/><path id="ciwatch-arrow-1" class="arrowhead" d="M222 95 L230 100 L222 105 z"/>
  <path class="path" d="M390 100 H435"/><path id="ciwatch-arrow-2" class="arrowhead" d="M427 95 L435 100 L427 105 z"/>
  <path class="path" d="M595 100 H640"/><path id="ciwatch-arrow-3" class="arrowhead" d="M632 95 L640 100 L632 105 z"/>
  <path class="path" d="M800 100 H845"/><path id="ciwatch-arrow-4" class="arrowhead" d="M837 95 L845 100 L837 105 z"/>
  <circle class="marker" cx="412" cy="100" r="11"/><text class="glyph" x="412" y="104" text-anchor="middle">30s</text>
  <text class="sub" x="412" y="78" text-anchor="middle">poll</text>
  <path class="path" d="M1005 100 H1012"/><path id="ciwatch-arrow-5" class="arrowhead" d="M1004 95 L1012 100 L1004 105 z"/>
  <rect class="chip" x="1012" y="87" width="60" height="26" rx="13"/><text class="chip-text" x="1042" y="104" text-anchor="middle">wakes</text>
</svg>
