<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="A switch goes one way: the Context panel writes a request file; jig-session takes it every two seconds and changes Pi's active tools and skills; the switch is saved and the panel stops drawing it dimmed. The request approves nothing." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}.chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}
      .glyph{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="189" rx="12"/>
  <rect class="node" x="25" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M95 75 h22 v18 h-22 z M100 80 h12 M100 85 h8 M100 90 h10"/>
  <text class="label" x="110" y="115" text-anchor="middle">Context panel</text>
  <text class="sub" x="110" y="132" text-anchor="middle">writes</text>

  <rect class="node" x="240" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M310 76 h20 v16 h-20 z M310 76 l10 9 10 -9"/>
  <text class="label" x="325" y="115" text-anchor="middle">request</text>
  <text class="sub" x="325" y="132" text-anchor="middle">file</text>

  <rect class="node" x="455" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M533 79 v-5 M543 79 v-5 M531 79 h14 v6 h-14 z M536 85 v3 M540 85 v3"/>
  <text class="label" x="540" y="115" text-anchor="middle">jig-session</text>
  <text class="sub" x="540" y="132" text-anchor="middle">applies</text>

  <rect class="node" x="670" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M740 75 l14 8 -14 8 z M735 75 v16"/>
  <text class="label" x="755" y="115" text-anchor="middle">Pi</text>
  <text class="sub" x="755" y="132" text-anchor="middle">tools · skills</text>

  <path class="path" d="M195 100 H240"/><path id="sessionswitch-arrow-1" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H455"/><path id="sessionswitch-arrow-2" class="arrowhead" d="M447 95 L455 100 L447 105 z"/>
  <path class="path" d="M625 100 H670"/><path id="sessionswitch-arrow-3" class="arrowhead" d="M662 95 L670 100 L662 105 z"/>
  <circle class="marker" cx="645" cy="100" r="11"/><text class="glyph" x="645" y="104" text-anchor="middle">2s</text>
  <text class="sub" x="645" y="82" text-anchor="middle">poll</text>
  <circle class="marker" cx="432" cy="100" r="11"/><text class="glyph" x="432" y="104" text-anchor="middle">↻</text>
  <text class="sub" x="432" y="72" text-anchor="middle">reload</text>
  <path class="path" d="M840 100 H875"/><path id="sessionswitch-arrow-4" class="arrowhead" d="M867 95 L875 100 L867 105 z"/>
  <rect class="chip" x="875" y="87" width="90" height="26" rx="13"/><text class="chip-text" x="920" y="104" text-anchor="middle">switched</text>
</svg>
