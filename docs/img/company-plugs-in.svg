<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="One generic jira tool, the same code, set up twice: each company supplies its own site, sign-in and rules skill, and the agent sees a jira tool configured for that company." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.card{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.core{fill:#f6f7f9;stroke:#2563eb;stroke-width:1.6}
    .label{fill:#1a1b1e;font-size:14px;font-weight:700}.small{fill:#5c626b;font-size:11px}
    .accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}
    .tag{fill:#fff;stroke:#2563eb;stroke-width:1.2}.tag-text{fill:#1a1b1e;font-size:11px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.card{fill:#18181b;stroke:#2c2c31}.core{fill:#18181b;stroke:#7aa2f7}
      .label{fill:#e7e7ea}.small{fill:#9a9aa2}.accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}
      .tag{fill:#202024;stroke:#7aa2f7}.tag-text{fill:#e7e7ea}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="379" rx="12"/>
  <text class="label" x="35" y="44">Company A</text>
  <text class="label" x="35" y="224">Company B</text>

  <rect class="card" x="30" y="60" width="230" height="120" rx="12"/>
  <text class="small" x="48" y="86">site</text>
  <text class="small" x="48" y="114">sign-in</text>
  <text class="small" x="48" y="142">rules skill</text>
  <rect class="tag" x="120" y="70" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="84" text-anchor="middle">jira.example</text>
  <rect class="tag" x="120" y="98" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="112" text-anchor="middle">company SSO</text>
  <rect class="tag" x="120" y="126" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="140" text-anchor="middle">PROJ rules</text>

  <rect class="card" x="30" y="240" width="230" height="120" rx="12"/>
  <text class="small" x="48" y="266">site</text>
  <text class="small" x="48" y="294">sign-in</text>
  <text class="small" x="48" y="322">rules skill</text>
  <rect class="tag" x="120" y="250" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="264" text-anchor="middle">jira2.example</text>
  <rect class="tag" x="120" y="278" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="292" text-anchor="middle">API token</text>
  <rect class="tag" x="120" y="306" width="120" height="20" rx="10"/><text class="tag-text" x="180" y="320" text-anchor="middle">APP rules</text>

  <rect class="core" x="380" y="70" width="240" height="240" rx="14"/>
  <text class="label" x="500" y="170" text-anchor="middle">jira</text>
  <text class="small" x="500" y="192" text-anchor="middle">one codebase</text>

  <rect class="card" x="720" y="60" width="245" height="120" rx="12"/>
  <text class="label" x="842" y="90" text-anchor="middle">agent A</text>
  <text class="small" x="842" y="114" text-anchor="middle">one jira tool</text>
  <text class="small" x="842" y="136" text-anchor="middle">PROJ + own rules</text>
  <rect class="card" x="720" y="240" width="245" height="120" rx="12"/>
  <text class="label" x="842" y="270" text-anchor="middle">agent B</text>
  <text class="small" x="842" y="294" text-anchor="middle">one jira tool</text>
  <text class="small" x="842" y="316" text-anchor="middle">APP + own rules</text>

  <path class="path" d="M260 120 H380"/><path id="company-a1-arrow-a" class="arrowhead" d="M372 115 L380 120 L372 125 z"/>
  <path class="path" d="M260 300 H380"/><path id="company-a1-arrow-b" class="arrowhead" d="M372 295 L380 300 L372 305 z"/>
  <path class="path" d="M620 120 H720"/><path id="company-a1-arrow-c" class="arrowhead" d="M712 115 L720 120 L712 125 z"/>
  <path class="path" d="M620 300 H720"/><path id="company-a1-arrow-d" class="arrowhead" d="M712 295 L720 300 L712 305 z"/>
</svg>
