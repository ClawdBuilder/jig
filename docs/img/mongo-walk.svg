<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="215" viewBox="6 31 1268 215" role="img" aria-label="How a mongo call runs: the agent asks jig-core for mongo; jig-core decides by environment, a read runs, a test write asks and a production write is denied; the walk checks every field against the access lists and refuses a denied or unlisted field before anything runs; the route opens the environment's connection, with an SSH forward or a company tunnel; MongoDB answers, and the rows come back with denied fields stripped and production results masked." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .marker-ring { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .glyph { fill: #2563eb; font-size: 12px; font-weight: 700; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #2563eb; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    .chip-no { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .chip-no-text { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .branch { fill: none; stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .branch-arrow { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .marker-ring { fill: #18181b; stroke: #7aa2f7; }
      .label { fill: #e7e7ea; }
      .glyph { fill: #7aa2f7; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .dot { fill: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
      .chip-no { fill: #2a1618; stroke: #ff7b72; }
      .chip-no-text { fill: #ff7b72; }
      .branch { stroke: #ff7b72; }
      .branch-arrow { fill: #ff7b72; }
    }
  </style>
  <rect class="bg" x="6.5" y="31.5" width="1267" height="214" rx="12"/>

  <!-- 1. the call -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M96 66 q-7 0 -7 7 v5 q0 6 -5 8 q5 2 5 8 v5 q0 7 7 7"/>
  <path class="accent" d="M134 66 q7 0 7 7 v5 q0 6 5 8 q-5 2 -5 8 v5 q0 7 -7 7"/>
  <text class="label" x="115" y="125" text-anchor="middle">mongo call</text>

  <!-- 2. decide -->
  <rect class="node" x="240" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M325 67 v17 M313 76 H337 M313 76 l-4 10 h8 M337 76 l-4 10 h8"/>
  <text class="label" x="325" y="125" text-anchor="middle">decide</text>

  <!-- 3. the field walk -->
  <rect class="node" x="450" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M505 72 H534 M505 80 H534 M505 88 H534"/>
  <path class="accent" d="M536 72 l2.6 2.6 4.4 -5.2 M536 80 l2.6 2.6 4.4 -5.2 M536 88 l2.6 2.6 4.4 -5.2"/>
  <text class="label" x="535" y="125" text-anchor="middle">field walk</text>

  <!-- 4. the route -->
  <rect class="node" x="660" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M712 66 H736 V86 H758"/>
  <circle class="dot" cx="712" cy="66" r="3.2"/>
  <path class="arrowhead" d="M758 81 L766 86 L758 91 z"/>
  <text class="label" x="745" y="125" text-anchor="middle">route</text>

  <!-- 5. MongoDB -->
  <rect class="node" x="870" y="55" width="170" height="90" rx="12"/>
  <ellipse class="accent" cx="955" cy="68" rx="18" ry="6"/>
  <path class="accent" d="M937 68 V86 M973 68 V86 M937 86 a18 6 0 0 0 36 0"/>
  <text class="label" x="955" y="125" text-anchor="middle">MongoDB</text>

  <!-- 6. the rows that come back -->
  <rect class="node" x="1080" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M1123 68 H1207 M1123 80 H1191 M1123 92 H1173"/>
  <text class="label" x="1165" y="125" text-anchor="middle">rows</text>

  <!-- the path, with an arrowhead entering each node -->
  <path class="path" d="M200 100 H240"/>
  <path id="mongowalk55-arrow-decide" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H450"/>
  <path id="mongowalk55-arrow-walk" class="arrowhead" d="M442 95 L450 100 L442 105 z"/>
  <path class="path" d="M620 100 H660"/>
  <path id="mongowalk55-arrow-route" class="arrowhead" d="M652 95 L660 100 L652 105 z"/>
  <path class="path" d="M830 100 H870"/>
  <path id="mongowalk55-arrow-mongo" class="arrowhead" d="M862 95 L870 100 L862 105 z"/>
  <path class="path" d="M1040 100 H1080"/>
  <path id="mongowalk55-arrow-rows" class="arrowhead" d="M1072 95 L1080 100 L1072 105 z"/>
  <text class="edge" x="220" y="89" text-anchor="middle">call</text>

  <!-- the lists the walk checks every field against -->
  <circle class="marker-ring" cx="430" cy="100" r="12"/>
  <circle class="dot" cx="425" cy="95" r="1.6"/>
  <circle class="dot" cx="425" cy="100" r="1.6"/>
  <circle class="dot" cx="425" cy="105" r="1.6"/>
  <path class="accent" d="M430 95 h5 M430 100 h5 M430 105 h5"/>
  <text class="muted" x="430" y="128" text-anchor="middle">lists</text>

  <!-- a denied or unlisted field stops the call before it runs -->
  <path class="branch" d="M535 145 V196"/>
  <path id="mongowalk55-arrow-refused" class="branch-arrow" d="M530 190 L535 196 L540 190 z"/>
  <rect class="chip-no" x="473" y="196" width="124" height="26" rx="13"/>
  <text class="chip-no-text" x="535" y="213" text-anchor="middle">refused</text>

  <!-- production results are masked on the way back -->
  <circle class="marker-ring" cx="1060" cy="100" r="12"/>
  <circle class="dot" cx="1054" cy="100" r="1.8"/>
  <circle class="dot" cx="1060" cy="100" r="1.8"/>
  <circle class="dot" cx="1066" cy="100" r="1.8"/>
  <text class="muted" x="1060" y="128" text-anchor="middle">mask</text>
</svg>
