<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-label="One tool call through jig-core: the model calls a tool; jig-core classifies it and decides whether to allow, ask or deny it; an allowed call runs, and its result is masked before the model sees it. Ask and deny are decisions on the path; a denied call is blocked and never runs." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .marker-ring { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .glyph { fill: #2563eb; font-size: 12px; font-weight: 700; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    .chip-ok { fill: #e6ffec; stroke: #1a7f37; stroke-width: 1.2; }
    .chip-ok-text { fill: #1a7f37; font-size: 12px; font-weight: 700; }
    .chip-no { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .chip-no-text { fill: #cf222e; font-size: 12px; font-weight: 700; }
    .branch { fill: none; stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .marker-ring { fill: #18181b; stroke: #7aa2f7; }
      .label { fill: #e7e7ea; }
      .glyph { fill: #7aa2f7; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
      .chip-ok { fill: #14251a; stroke: #6ccb8a; }
      .chip-ok-text { fill: #6ccb8a; }
      .chip-no { fill: #2a1618; stroke: #ff7b72; }
      .chip-no-text { fill: #ff7b72; }
      .branch { stroke: #ff7b72; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1159" height="299" rx="12"/>

  <!-- 1. tool call -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="105" y="68" width="22" height="20" rx="4"/>
  <path class="accent" d="M110 74 l4 4 -4 4 M118 82 h5"/>
  <text class="label" x="115" y="125" text-anchor="middle">tool call</text>

  <!-- 2. classify -->
  <rect class="node" x="240" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M315 69 l10 0 10 10 -14 14 -10 -10 z M330 74 l3 3"/>
  <text class="label" x="325" y="125" text-anchor="middle">classify</text>

  <!-- 3. decide: a branch, not a letter -->
  <rect class="node" x="450" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M535 67 v17 M523 76 H547 M523 76 l-4 10 h8 M547 76 l-4 10 h8"/>
  <text class="label" x="535" y="125" text-anchor="middle">decide</text>

  <!-- 4. run -->
  <rect class="node" x="660" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M742 69 l18 9 -18 9 z"/>
  <text class="label" x="745" y="125" text-anchor="middle">run</text>

  <!-- 5. result hook -->
  <rect class="node" x="870" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M948 68 l12 3 v9 c0 7 -5 11 -12 14 c-7 -3 -12 -7 -12 -14 v-9 z M943 82 l4 4 7 -8"/>
  <text class="label" x="955" y="125" text-anchor="middle">result</text>

  <!-- the path, with an arrowhead entering each node -->
  <path class="path" d="M200 100 H240"/>
  <path id="onecall55-arrow-classify" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H450"/>
  <path id="onecall55-arrow-decide" class="arrowhead" d="M442 95 L450 100 L442 105 z"/>
  <path class="path" d="M620 100 H660"/>
  <path id="onecall55-arrow-run" class="arrowhead" d="M652 95 L660 100 L652 105 z"/>
  <path class="path" d="M830 100 H870"/>
  <path id="onecall55-arrow-result" class="arrowhead" d="M862 95 L870 100 L862 105 z"/>
  <text class="edge" x="220" y="89" text-anchor="middle">call</text>
  <text class="edge" x="430" y="89" text-anchor="middle">verdict</text>

  <!-- ask: a question in a circle, with its label beside it -->
  <circle class="marker-ring" cx="640" cy="100" r="12"/>
  <text class="glyph" x="640" y="104" text-anchor="middle">?</text>
  <text class="muted" x="640" y="128" text-anchor="middle">ask</text>

  <!-- mask: three dots in a circle -->
  <circle class="marker-ring" cx="850" cy="100" r="12"/>
  <circle class="arrowhead" cx="844" cy="100" r="1.8"/>
  <circle class="arrowhead" cx="850" cy="100" r="1.8"/>
  <circle class="arrowhead" cx="856" cy="100" r="1.8"/>
  <text class="muted" x="850" y="128" text-anchor="middle">mask</text>

  <!-- deny branches down to its outcome -->
  <circle class="chip-no" cx="535" cy="178" r="12"/>
  <path class="branch" d="M535 160 V178"/>
  <path class="accent" d="M530 173 l10 10 M540 173 l-10 10"/>
  <text class="muted" x="552" y="183">deny</text>
  <path class="branch" d="M535 190 V205"/>
  <path id="onecall55-arrow-allowed" class="arrowhead" d="M530 198 L535 205 L540 198 z"/>
  <rect class="chip-no" x="483" y="205" width="104" height="26" rx="13"/>
  <text class="chip-no-text" x="535" y="222" text-anchor="middle">blocked</text>

  <!-- allowed is the outcome at the end of the path -->
  <path class="path" d="M1040 100 H1055"/>
  <path id="onecall55-arrow-blocked" class="arrowhead" d="M1047 95 L1055 100 L1047 105 z"/>
  <rect class="chip-ok" x="1055" y="87" width="84" height="26" rx="13"/>
  <text class="chip-ok-text" x="1097" y="104" text-anchor="middle">allowed</text>
</svg>
