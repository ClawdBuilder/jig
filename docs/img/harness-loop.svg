<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Codebase drift and runtime sensors feed Pi; harness sensors built from sessions and tickets feed you; you steer Pi. It is a map of two feedback channels, not one sequence." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.dash{fill:none;stroke:#2563eb;stroke-width:1.6;stroke-dasharray:4 4}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.dash{stroke:#7aa2f7}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="269" rx="12"/>
  <rect class="node" x="25" y="45" width="170" height="85" rx="12"/>
  <path class="accent" d="M95 62 v10 M95 72 l-10 10 M95 72 l10 10 M85 82 v8 M105 82 v8"/>
  <text class="label" x="110" y="108" text-anchor="middle">codebase</text>
  <text class="sub" x="110" y="122" text-anchor="middle">drift</text>

  <rect class="node" x="25" y="160" width="170" height="85" rx="12"/>
  <path class="accent" d="M90 197 h8 l6 -10 8 20 6 -10 h7"/>
  <text class="label" x="110" y="222" text-anchor="middle">runtime</text>
  <text class="sub" x="110" y="236" text-anchor="middle">signals</text>

  <rect class="node" x="330" y="100" width="180" height="85" rx="12"/>
  <path class="accent" d="M408 113 h5 v16 h-5 M418 118 h14 M418 124 h10 M418 130 h12"/>
  <text class="label" x="420" y="160" text-anchor="middle">Pi</text>
  <text class="sub" x="420" y="174" text-anchor="middle">acts</text>

  <rect class="node" x="650" y="45" width="180" height="85" rx="12"/>
  <path class="accent" d="M725 62 h20 v8 h-20 z M730 70 v10 M740 70 v10"/>
  <text class="label" x="740" y="108" text-anchor="middle">harness</text>
  <text class="sub" x="740" y="122" text-anchor="middle">sensors</text>

  <rect class="node" x="650" y="160" width="180" height="85" rx="12"/>
  <circle class="accent" cx="740" cy="180" r="6"/><path class="accent" d="M740 188 v12 M731 193 h18 M740 200 l-5 7 M740 200 l5 7"/>
  <text class="label" x="740" y="222" text-anchor="middle">you</text>
  <text class="sub" x="740" y="236" text-anchor="middle">steer</text>

  <path class="path" d="M195 83 H330"/><path id="harnessloop-c1-arrow-1" class="arrowhead" d="M322 78 L330 83 L322 88 z"/>
  <path class="path" d="M195 197 H300 V140 H330"/><path id="harnessloop-c1-arrow-2" class="arrowhead" d="M322 135 L330 140 L322 145 z"/>
  <path class="path" d="M740 120 V160"/><path id="harnessloop-c1-arrow-3" class="arrowhead" d="M735 152 L740 160 L745 152 z"/>
  <path class="dash" d="M650 198 H510 V140"/><path id="harnessloop-c1-arrow-4" class="arrowhead" d="M505 148 L510 140 L515 148 z"/>
  <text class="sub" x="560" y="190" text-anchor="middle">steer</text>
</svg>
