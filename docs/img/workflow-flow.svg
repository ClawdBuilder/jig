<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250" role="img" aria-label="A workflow runs in one path: workflow files name the stages; evidence is made where it can be checked; results are saved in workflow.json against the commit or plan; status and advance read it and check eight conditions; a gate in jig-core holds the call until they pass." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:12px;font-weight:700}.chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:12px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}
      .glyph{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1079" height="249" rx="12"/>
  <rect class="node" x="30" y="70" width="150" height="90" rx="12"/>
  <path class="accent" d="M95 86 h20 v22 h-20 z M101 92 h8 M101 98 h8 M101 104 h5"/>
  <text class="label" x="105" y="125" text-anchor="middle">workflow</text>
  <text class="sub" x="105" y="143" text-anchor="middle">stages</text>

  <rect class="node" x="220" y="70" width="150" height="90" rx="12"/>
  <path class="accent" d="M280 86 l10 0 v16 h-20 v-16 z M276 102 v8 M290 102 v8 M276 114 h14"/>
  <text class="label" x="295" y="125" text-anchor="middle">evidence</text>
  <text class="sub" x="295" y="143" text-anchor="middle">tests · plan</text>

  <rect class="node" x="410" y="70" width="150" height="90" rx="12"/>
  <path class="accent" d="M475 86 h20 v22 h-20 z M480 92 h10 M480 98 h10 M480 104 h7"/>
  <text class="label" x="485" y="125" text-anchor="middle">workflow.json</text>
  <text class="sub" x="485" y="143" text-anchor="middle">at commit</text>

  <rect class="node" x="600" y="70" width="150" height="90" rx="12"/>
  <path class="accent" d="M665 88 h16 M665 96 h16 M665 104 h10"/>
  <text class="label" x="675" y="125" text-anchor="middle">conditions</text>
  <text class="sub" x="675" y="143" text-anchor="middle">status · advance</text>

  <rect class="node" x="790" y="70" width="150" height="90" rx="12"/>
  <path class="accent" d="M850 86 v22 M840 92 v8 M860 92 v8 M840 92 h20"/>
  <text class="label" x="865" y="125" text-anchor="middle">gate</text>
  <text class="sub" x="865" y="143" text-anchor="middle">jig-core</text>

  <path class="path" d="M180 115 H220"/><path id="workflow-a1-arrow-1" class="arrowhead" d="M212 110 L220 115 L212 120 z"/>
  <path class="path" d="M370 115 H410"/><path id="workflow-a1-arrow-2" class="arrowhead" d="M402 110 L410 115 L402 120 z"/>
  <path class="path" d="M560 115 H600"/><path id="workflow-a1-arrow-3" class="arrowhead" d="M592 110 L600 115 L592 120 z"/>
  <path class="path" d="M750 115 H790"/><path id="workflow-a1-arrow-4" class="arrowhead" d="M782 110 L790 115 L782 120 z"/>
  <circle class="marker" cx="675" cy="55" r="12"/><text class="glyph" x="675" y="59" text-anchor="middle">8</text>
  <text class="sub" x="675" y="38" text-anchor="middle">8 checks</text>
  <path class="path" d="M940 115 H970"/><path id="workflow-a1-arrow-5" class="arrowhead" d="M962 110 L970 115 L962 120 z"/>
  <rect class="chip" x="970" y="102" width="84" height="26" rx="13"/><text class="chip-text" x="1012" y="119" text-anchor="middle">advance</text>
</svg>
