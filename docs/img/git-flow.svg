<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="229" viewBox="6 31 1168 229" role="img" aria-label="One jig-git call, left to right: the agent calls git, pr or release; jig-core decides each action by environment and effect, and the verdicts are these: a push asks you, the pr writes ask you, a protected branch is refused, and reads run. The call then runs through local git, or through gh on GitHub and glab on GitLab, and a push announces jig-git:pushed on Pi's event bus, where jig-ops starts a CI watch." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip-ok { fill: #e6ffec; stroke: #1a7f37; stroke-width: 1.2; }
    .chip-ok-text { fill: #1a7f37; font-size: 12px; font-weight: 700; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .small { fill: #5c626b; font-size: 11px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .chip { fill: #18181b; stroke: #2c2c31; }
      .chip-ok { fill: #14251a; stroke: #6ccb8a; }
      .chip-ok-text { fill: #6ccb8a; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .small { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="6.5" y="31.5" width="1167" height="228" rx="12"/>

  <!-- 1. the call -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="102" y="65" width="28" height="22" rx="3"/>
  <path class="accent" d="M107 72 l4 4 -4 4 M115 80 h6"/>
  <text class="label" x="115" y="117" text-anchor="middle">call</text>

  <!-- 2. the decision -->
  <rect class="node" x="270" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M355 67 v13 M343 76 H367 M343 76 l-3 8 h6 M367 76 l-3 8 h6"/>
  <text class="label" x="355" y="117" text-anchor="middle">decide</text>

  <!-- 3. the run: local git or the forge -->
  <rect class="node" x="510" y="55" width="170" height="90" rx="12"/>
  <circle class="accent" cx="595" cy="78" r="8"/>
  <path class="accent" d="M595 70 v16 M587 74 h16 M587 82 h16"/>
  <text class="label" x="595" y="115" text-anchor="middle">run</text>
  <text class="sub" x="595" y="132" text-anchor="middle">git or gh</text>

  <!-- 4. the push -->
  <rect class="node" x="750" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="824" y="66" width="22" height="13" rx="2"/>
  <path class="accent" d="M835 94 V83 M830 88 l5 -5 5 5"/>
  <text class="label" x="835" y="117" text-anchor="middle">push</text>

  <!-- the path -->
  <path class="path" d="M200 100 H270"/>
  <path id="gitflow56-arrow-decide" class="arrowhead" d="M262 95 L270 100 L262 105 z"/>
  <path class="path" d="M440 100 H510"/>
  <path id="gitflow56-arrow-run" class="arrowhead" d="M502 95 L510 100 L502 105 z"/>
  <path class="path" d="M680 100 H750"/>
  <path id="gitflow56-arrow-push" class="arrowhead" d="M742 95 L750 100 L742 105 z"/>

  <!-- the verdicts at decide: what each action gets -->
  <rect class="chip" x="236" y="160" width="112" height="34" rx="9"/>
  <path class="accent" d="M250 178 v-7 M246.5 174.5 l3.5 -3.5 3.5 3.5 M244 180 h12"/>
  <text class="small" x="264" y="180">push asks</text>
  <rect class="chip" x="356" y="160" width="100" height="34" rx="9"/>
  <circle class="accent" cx="370" cy="171" r="2.4"/>
  <path class="accent" d="M370 173.4 V180 M373 173.4 c5 0 5 6.6 9 6.6"/>
  <circle class="accent" cx="382" cy="180" r="1.8"/>
  <text class="small" x="391" y="180">pr asks</text>
  <rect class="chip" x="236" y="202" width="130" height="34" rx="9"/>
  <path class="accent" d="M250 212 l7 3 v5 c0 4 -3 6 -7 8 c-4 -2 -7 -4 -7 -8 v-5 z"/>
  <path class="accent" d="M246 221 l3 3 5 -6"/>
  <text class="small" x="266" y="223">protected refused</text>
  <rect class="chip" x="374" y="202" width="100" height="34" rx="9"/>
  <path class="accent" d="M385 223 q6 -5 12 0 q-6 5 -12 0 z"/>
  <circle class="accent" cx="391" cy="223" r="1.8"/>
  <text class="small" x="403" y="223">reads run</text>

  <!-- a push announces itself, and jig-ops listens -->
  <path class="path" d="M920 100 H1000"/>
  <path id="gitflow56-arrow-event" class="arrowhead" d="M992 95 L1000 100 L992 105 z"/>
  <rect class="chip-ok" x="1000" y="87" width="150" height="26" rx="13"/>
  <text class="chip-ok-text" x="1075" y="104" text-anchor="middle">jig-git:pushed</text>
</svg>
