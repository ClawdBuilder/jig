<svg xmlns="http://www.w3.org/2000/svg" width="918" height="368" viewBox="16 36 918 368" role="img" aria-label="Memory as one path: Pi writes ticket memory while it works, one folder per ticket; when a later ticket starts, recall matches that ticket's keys, identifiers, error lines and keywords against the past cards and hands Pi a short message. Still design, and drawn as two quiet tiles: personal memory, your rules that go with you from company to company, and organizational memory, the shared facts you approve." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .later { fill: none; stroke: #5c626b; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .muted { fill: #5c626b; font-size: 12px; }
    .small { fill: #5c626b; font-size: 11px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .chip { fill: #18181b; stroke: #2c2c31; }
      .later { stroke: #9a9aa2; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .muted { fill: #9a9aa2; }
      .small { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="16.5" y="36.5" width="917" height="367" rx="12"/>

  <!-- 1. Pi on a ticket -->
  <rect class="node" x="40" y="60" width="170" height="90" rx="12"/>
  <rect class="accent" x="112" y="70" width="28" height="22" rx="3"/>
  <path class="accent" d="M117 77 l4 4 -4 4 M125 85 h6"/>
  <text class="label" x="125" y="122" text-anchor="middle">Pi</text>

  <!-- 2. ticket memory -->
  <rect class="node" x="270" y="60" width="170" height="90" rx="12"/>
  <path class="accent" d="M337 70 h12 l5 6 h36 v26 h-53 z"/>
  <path class="accent" d="M347 82 h32 M347 90 h32 M347 98 h22"/>
  <text class="label" x="355" y="122" text-anchor="middle">ticket memory</text>

  <!-- 3. recall, at the start of a later ticket -->
  <rect class="node" x="500" y="60" width="170" height="90" rx="12"/>
  <circle class="accent" cx="579" cy="80" r="10"/>
  <path class="accent" d="M587 88 l10 10"/>
  <text class="label" x="585" y="122" text-anchor="middle">recall</text>

  <!-- 4. the short message -->
  <rect class="node" x="730" y="60" width="170" height="90" rx="12"/>
  <path class="accent" d="M796 70 H844 V90 H818 l-9 9 v-9 h-13 z"/>
  <path class="accent" d="M804 78 H836 M804 84 H824"/>
  <text class="label" x="815" y="122" text-anchor="middle">short message</text>

  <!-- the path -->
  <path class="path" d="M210 105 H270"/>
  <path id="memkinds56-arrow-memory" class="arrowhead" d="M262 100 L270 105 L262 110 z"/>
  <text class="edge" x="240" y="95" text-anchor="middle">writes</text>
  <path class="path" d="M440 105 H500"/>
  <path id="memkinds56-arrow-recall" class="arrowhead" d="M492 100 L500 105 L492 110 z"/>
  <text class="edge" x="470" y="95" text-anchor="middle">at start</text>
  <path class="path" d="M670 105 H730"/>
  <path id="memkinds56-arrow-message" class="arrowhead" d="M722 100 L730 105 L722 110 z"/>

  <!-- what recall matches, as small chips on it -->
  <rect class="chip" x="500" y="170" width="80" height="28" rx="8"/>
  <text class="small" x="540" y="188" text-anchor="middle">keys</text>
  <rect class="chip" x="590" y="170" width="80" height="28" rx="8"/>
  <text class="small" x="630" y="188" text-anchor="middle">identifiers</text>
  <rect class="chip" x="500" y="206" width="80" height="28" rx="8"/>
  <text class="small" x="540" y="224" text-anchor="middle">error lines</text>
  <rect class="chip" x="590" y="206" width="80" height="28" rx="8"/>
  <text class="small" x="630" y="224" text-anchor="middle">keywords</text>

  <!-- the message reaches Pi when a later ticket starts -->
  <path class="path" d="M815 150 V278 H125 V150"/>
  <path id="memkinds56-arrow-back" class="arrowhead" d="M120 158 L125 150 L130 158 z"/>

  <!-- still design: two quiet tiles, no arrows -->
  <rect class="later" x="290" y="310" width="270" height="70" rx="12"/>
  <text class="label" x="310" y="340">personal memory</text>
  <text class="small" x="310" y="361">your rules, any company</text>
  <rect class="later" x="640" y="310" width="270" height="70" rx="12"/>
  <text class="label" x="660" y="340">organizational memory</text>
  <text class="small" x="660" y="361">shared facts</text>
</svg>
