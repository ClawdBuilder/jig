<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-label="Three kinds of memory, and the paths between them. Pi writes ticket memory while it works: one folder per ticket, with notes and a card. At the start of a later ticket, recall matches the new ticket's keys, identifiers, error lines and words against past cards, and hands Pi a short message. Still design: at close a memory keeper writes the card and proposes organizational facts, which you approve, and personal rules that go with you from company to company, while the company's facts stay behind." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .panel { fill: none; stroke: #5c626b; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .marker-ring { fill: #ffffff; stroke: #b05a8a; stroke-width: 1.5; }
    .title { fill: #1a1b1e; font-size: 15px; font-weight: 700; }
    .label { fill: #1a1b1e; font-size: 13px; font-weight: 700; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .you { fill: #b05a8a; }
    .dot { fill: #2563eb; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .later-path { fill: none; stroke: #5c626b; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .arrowhead { fill: #2563eb; }
    .later-head { fill: #5c626b; }
    .chip-muted { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .chip-muted-text { fill: #5c626b; font-size: 11px; font-weight: 700; }
    .chip-ok { fill: #e6ffec; stroke: #1a7f37; stroke-width: 1.2; }
    .chip-ok-text { fill: #1a7f37; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .panel { stroke: #9a9aa2; }
      .marker-ring { fill: #18181b; stroke: #d98ab8; }
      .title { fill: #e7e7ea; }
      .label { fill: #e7e7ea; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .you { fill: #d98ab8; }
      .dot { fill: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .later-path { stroke: #9a9aa2; }
      .arrowhead { fill: #7aa2f7; }
      .later-head { fill: #9a9aa2; }
      .chip-muted { fill: #202024; stroke: #2c2c31; }
      .chip-muted-text { fill: #9a9aa2; }
      .chip-ok { fill: #14251a; stroke: #6ccb8a; }
      .chip-ok-text { fill: #6ccb8a; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="1239" height="639" rx="12"/>

  <!-- Pi, on a ticket -->
  <rect class="node" x="30" y="80" width="190" height="470" rx="12"/>
  <text class="title" x="125" y="120" text-anchor="middle">Pi</text>
  <path class="accent" d="M112 140 h26 v30 h-26 z M118 148 H132 M118 155 H132 M118 162 H126"/>
  <text class="muted" x="125" y="192" text-anchor="middle">on a ticket</text>

  <!-- ticket memory: today -->
  <rect class="node" x="780" y="80" width="430" height="260" rx="12"/>
  <text class="title" x="798" y="112">Ticket memory</text>
  <rect class="chip-ok" x="1120" y="94" width="72" height="24" rx="12"/>
  <text class="chip-ok-text" x="1156" y="110" text-anchor="middle">today</text>
  <rect class="node" x="1010" y="150" width="180" height="60" rx="6"/>
  <rect class="node" x="995" y="168" width="180" height="60" rx="6"/>
  <rect class="node" x="820" y="186" width="340" height="120" rx="6"/>
  <path class="accent" d="M846 214 h20 v24 h-20 z M872 220 H1000 M872 232 H980 M872 244 H940"/>
  <text class="muted" x="1030" y="222" text-anchor="end">notes</text>
  <path class="accent" d="M846 268 h20 v24 h-20 z M872 274 H1000 M872 286 H960"/>
  <text class="muted" x="1030" y="276" text-anchor="end">card</text>

  <!-- recall, at the start of a later ticket -->
  <rect class="node" x="350" y="80" width="350" height="250" rx="12"/>
  <text class="title" x="368" y="112">Recall</text>
  <text class="muted" x="368" y="132">at ticket start</text>
  <rect class="node" x="375" y="148" width="300" height="26" rx="6"/>
  <text class="muted" x="525" y="166" text-anchor="middle">keys</text>
  <rect class="node" x="375" y="182" width="300" height="26" rx="6"/>
  <text class="muted" x="525" y="200" text-anchor="middle">identifiers</text>
  <rect class="node" x="375" y="216" width="300" height="26" rx="6"/>
  <text class="muted" x="525" y="234" text-anchor="middle">error lines</text>
  <rect class="node" x="375" y="250" width="300" height="26" rx="6"/>
  <text class="muted" x="525" y="268" text-anchor="middle">keywords</text>

  <!-- the keeper: design -->
  <rect class="panel" x="850" y="386" width="170" height="40" rx="6"/>
  <text class="muted" x="935" y="411" text-anchor="middle">memory keeper</text>

  <!-- you approve: design -->
  <circle class="marker-ring" cx="1062" cy="406" r="12"/>
  <circle class="you" cx="1062" cy="402" r="3.4"/>
  <path class="you" d="M1055.6 412.4 Q1055.6 406 1062 406 Q1068.4 406 1068.4 412.4 Z"/>
  <text class="muted" x="1082" y="410">you approve</text>

  <!-- organizational memory: design -->
  <rect class="panel" x="780" y="450" width="430" height="160" rx="12"/>
  <text class="title" x="798" y="482">Organizational memory</text>
  <rect class="chip-muted" x="1120" y="464" width="72" height="24" rx="12"/>
  <text class="chip-muted-text" x="1156" y="480" text-anchor="middle">later</text>
  <text class="muted" x="798" y="516">shared facts</text>
  <text class="muted" x="798" y="544">true for every ticket</text>

  <!-- personal memory: design -->
  <rect class="panel" x="350" y="450" width="340" height="160" rx="12"/>
  <text class="title" x="368" y="482">Personal memory</text>
  <rect class="chip-muted" x="600" y="464" width="72" height="24" rx="12"/>
  <text class="chip-muted-text" x="636" y="480" text-anchor="middle">later</text>
  <text class="muted" x="368" y="516">your rules</text>
  <text class="muted" x="368" y="544">company facts stay behind</text>

  <!-- Pi writes ticket memory as it works -->
  <path class="path" d="M125 80 V52 H995 V80"/>
  <path id="memkinds55-arrow-writes" class="arrowhead" d="M988 72 L995 80 L1002 72 z"/>
  <text class="edge" x="560" y="44" text-anchor="middle">writes</text>

  <!-- past cards feed recall, and recall hands Pi a short message -->
  <path class="path" d="M780 215 H700"/>
  <path id="memkinds55-arrow-cards" class="arrowhead" d="M708 210 L700 215 L708 220 z"/>
  <text class="edge" x="740" y="203" text-anchor="middle">past cards</text>
  <path class="path" d="M350 215 H220"/>
  <path id="memkinds55-arrow-message" class="arrowhead" d="M228 210 L220 215 L228 220 z"/>
  <text class="edge" x="285" y="203" text-anchor="middle">short message</text>

  <!-- at close the keeper proposes facts, and you approve them -->
  <path class="later-path" d="M935 340 V386"/>
  <path id="memkinds55-arrow-keeper" class="later-head" d="M930 378 L935 386 L940 378 z"/>
  <text class="edge" x="950" y="368">at close</text>
  <path class="later-path" d="M1020 406 H1038"/>
  <path id="memkinds55-arrow-you" class="later-head" d="M1032 401 L1038 406 L1032 411 z"/>
  <path class="later-path" d="M1062 418 V450"/>
  <path id="memkinds55-arrow-approved" class="later-head" d="M1057 442 L1062 450 L1067 442 z"/>
  <text class="edge" x="1078" y="440">approved</text>

  <!-- organizational facts are recalled with the cards -->
  <path class="later-path" d="M780 510 H724 V300 H700"/>
  <path id="memkinds55-arrow-facts" class="later-head" d="M708 295 L700 300 L708 305 z"/>
  <text class="edge" x="740" y="292">facts</text>

  <!-- personal rules come with you, as a message -->
  <path class="later-path" d="M350 520 H220"/>
  <path id="memkinds55-arrow-personal" class="later-head" d="M228 515 L220 520 L228 525 z"/>
  <text class="edge" x="285" y="508" text-anchor="middle">as a message</text>
</svg>
