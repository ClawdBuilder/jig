<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="133" viewBox="6 31 1118 133" role="img" aria-label="How a saved jig-api request runs: the agent runs one by name with variable values; the tool fills only the variables and keeps the host, method and headers as saved; a write is previewed and asks you to approve the exact request; jig-core sends it to the API with the credential, and a lost reply is checked once and never sent again; and the result has secrets removed, is masked in production and is cut at 200 lines before the agent reads it." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .marker-ring { fill: #ffffff; stroke: #b05a8a; stroke-width: 1.5; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .you { fill: #b05a8a; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .marker-ring { fill: #18181b; stroke: #d98ab8; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .you { fill: #d98ab8; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="6.5" y="31.5" width="1117" height="132" rx="12"/>

  <!-- 1. run by name -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M104 62 h16 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-16 a3 3 0 0 1 -3 -3 v-26 a3 3 0 0 1 3 -3 z"/>
  <path class="accent" d="M110 71 l10 7 -10 7 z"/>
  <text class="label" x="115" y="118" text-anchor="middle">run by name</text>
  <text class="sub" x="115" y="136" text-anchor="middle">a saved request</text>

  <!-- 2. fill only the variables -->
  <rect class="node" x="240" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M326 64 q-7 0 -7 6 v4 q0 5 -5 4 q5 -1 5 4 v4 q0 6 7 6"/>
  <path class="accent" d="M344 64 q7 0 7 6 v4 q0 5 5 4 q-5 -1 -5 4 v4 q0 6 -7 6"/>
  <text class="label" x="325" y="118" text-anchor="middle">fill variables</text>
  <text class="sub" x="325" y="136" text-anchor="middle">host pinned</text>

  <!-- 3. the preview -->
  <rect class="node" x="450" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M514 78 q16 -13 32 0 q-16 13 -32 0 z"/>
  <circle class="accent" cx="530" cy="78" r="4.4"/>
  <text class="label" x="535" y="118" text-anchor="middle">preview</text>

  <!-- 4. send, and the API -->
  <rect class="node" x="690" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="761" y="62" width="28" height="12" rx="2"/>
  <rect class="accent" x="761" y="80" width="28" height="12" rx="2"/>
  <circle class="accent" cx="767" cy="68" r="1.6"/>
  <circle class="accent" cx="767" cy="86" r="1.6"/>
  <text class="label" x="775" y="118" text-anchor="middle">API</text>
  <text class="sub" x="775" y="136" text-anchor="middle">with the credential</text>

  <!-- 5. the result -->
  <rect class="node" x="930" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M1004 62 h16 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-16 a3 3 0 0 1 -3 -3 v-26 a3 3 0 0 1 3 -3 z"/>
  <path class="accent" d="M1008 70 h16 M1008 77 h16 M1008 84 h10"/>
  <text class="label" x="1015" y="118" text-anchor="middle">result</text>
  <text class="sub" x="1015" y="136" text-anchor="middle">masked · capped</text>

  <!-- the path -->
  <path class="path" d="M200 100 H240"/>
  <path id="apirun55-arrow-fill" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H450"/>
  <path id="apirun55-arrow-preview" class="arrowhead" d="M442 95 L450 100 L442 105 z"/>
  <path class="path" d="M620 100 H690"/>
  <path id="apirun55-arrow-api" class="arrowhead" d="M682 95 L690 100 L682 105 z"/>
  <path class="path" d="M860 100 H930"/>
  <path id="apirun55-arrow-result" class="arrowhead" d="M922 95 L930 100 L922 105 z"/>

  <!-- your approval, and the credential jig-core adds -->
  <circle class="marker-ring" cx="655" cy="100" r="12"/>
  <circle class="you" cx="655" cy="96" r="3.2"/>
  <path class="you" d="M649 105.4 Q649 99 655 99 Q661 99 661 105.4 Z"/>
  <text class="muted" x="655" y="128" text-anchor="middle">approval</text>
</svg>
