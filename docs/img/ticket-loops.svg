<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="263" viewBox="6 31 1268 263" role="img" aria-label="A ticket over time, left to right: the guides go into Pi before it writes code; Pi writes the change; the edit loop runs its checks before each commit; a checker agent reviews the change in a fresh context; you give one approval per change with all the evidence; and after the pull request, CI checks, reviews and teammates report back as new commits, so the feedback returns to Pi. The edit loop and the stage gates are built; the checker, the one approval and the delivery loop are later." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .muted { fill: #5c626b; font-size: 12px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    .back { fill: none; stroke: #5c626b; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .back-head { fill: #5c626b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .muted { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
      .back { stroke: #9a9aa2; }
      .back-head { fill: #9a9aa2; }
    }
  </style>
  <rect class="bg" x="6.5" y="31.5" width="1267" height="262" rx="12"/>

  <!-- 1. the guides -->
  <rect class="node" x="30" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="106" y="64" width="20" height="26" rx="2"/>
  <path class="accent" d="M111 71 H121 M111 78 H121 M111 85 H117"/>
  <path class="accent" d="M124 68 h10 v26 h-10"/>
  <text class="label" x="115" y="122" text-anchor="middle">guides</text>
  <text class="sub" x="115" y="140" text-anchor="middle">before it acts</text>

  <!-- 2. Pi writes -->
  <rect class="node" x="240" y="55" width="170" height="90" rx="12"/>
  <rect class="accent" x="312" y="64" width="28" height="22" rx="3"/>
  <path class="accent" d="M317 71 l4 4 -4 4 M325 79 h6"/>
  <text class="label" x="325" y="122" text-anchor="middle">Pi</text>
  <text class="sub" x="325" y="140" text-anchor="middle">writes the change</text>

  <!-- 3. the edit loop -->
  <rect class="node" x="450" y="55" width="170" height="90" rx="12"/>
  <path class="accent" d="M522 82 a13 13 0 1 1 4 -9 M526 64 l1 9 -9 -1"/>
  <text class="label" x="535" y="122" text-anchor="middle">edit loop</text>
  <text class="sub" x="535" y="140" text-anchor="middle">before each commit</text>

  <!-- 4. the checker: later -->
  <rect class="node" x="660" y="55" width="170" height="90" rx="12"/>
  <circle class="accent" cx="741" cy="75" r="9"/>
  <path class="accent" d="M748 82 l9 9"/>
  <text class="label" x="745" y="122" text-anchor="middle">checker</text>
  <text class="sub" x="745" y="140" text-anchor="middle">a fresh context</text>

  <!-- 5. your one approval: later -->
  <rect class="node" x="870" y="55" width="170" height="90" rx="12"/>
  <circle class="accent" cx="950" cy="70" r="4.4"/>
  <path class="accent" d="M940 88 Q940 78 950 78 Q960 78 960 88"/>
  <path class="accent" d="M964 82 l4 4 8 -9"/>
  <text class="label" x="955" y="122" text-anchor="middle">your approval</text>
  <text class="sub" x="955" y="140" text-anchor="middle">one per change</text>

  <!-- 6. the pull request -->
  <rect class="node" x="1080" y="55" width="170" height="90" rx="12"/>
  <circle class="accent" cx="1152" cy="70" r="3.2"/>
  <path class="accent" d="M1152 73.2 V84 M1172 73.2 V84"/>
  <circle class="accent" cx="1172" cy="70" r="3.2"/>
  <path class="accent" d="M1156 80.5 H1166"/>
  <path class="accent" d="M1164 76.5 L1168 80.5 L1164 84.5 z"/>
  <text class="label" x="1165" y="122" text-anchor="middle">pull request</text>

  <!-- the path -->
  <path class="path" d="M200 100 H240"/>
  <path id="loops55-arrow-pi" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H450"/>
  <path id="loops55-arrow-edit" class="arrowhead" d="M442 95 L450 100 L442 105 z"/>
  <path class="path" d="M620 100 H660"/>
  <path id="loops55-arrow-checker" class="arrowhead" d="M652 95 L660 100 L652 105 z"/>
  <path class="path" d="M830 100 H870"/>
  <path id="loops55-arrow-approval" class="arrowhead" d="M862 95 L870 100 L862 105 z"/>
  <path class="path" d="M1040 100 H1080"/>
  <path id="loops55-arrow-pr" class="arrowhead" d="M1072 95 L1080 100 L1072 105 z"/>

  <!-- the feedback comes back to Pi as new commits -->
  <path class="back" d="M1165 145 V270 H325 V145"/>
  <path id="loops55-arrow-feedback" class="back-head" d="M320 153 L325 145 L330 153 z"/>
  <text class="muted" x="745" y="258" text-anchor="middle">CI · reviews</text>
</svg>
