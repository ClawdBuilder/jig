<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Pi tells jig-session about each event; jig-session writes the session's status file by a temporary file and a rename; the Herdr panel reads the files every two seconds while it is shown and draws the focused session." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}.chip{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.chip-text{fill:#1a7f37;font-size:11px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}
      .glyph{fill:#7aa2f7}.chip{fill:#14251a;stroke:#6ccb8a}.chip-text{fill:#6ccb8a}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="189" rx="12"/>
  <rect class="node" x="25" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M96 76 h5 v16 h-5 M105 80 h13 M105 86 h9 M105 92 h11"/>
  <text class="label" x="110" y="125" text-anchor="middle">Pi events</text>
  <text class="sub" x="110" y="140" text-anchor="middle">each turn</text>

  <rect class="node" x="240" y="60" width="170" height="80" rx="12"/>
  <circle class="accent" cx="325" cy="84" r="6"/><path class="accent" d="M325 74 v3 M325 91 v3 M314 84 h3 M333 84 h3 M317 76 l2 2 M333 76 l-2 2 M317 92 l2 -2 M333 92 l-2 -2"/>
  <text class="label" x="325" y="125" text-anchor="middle">jig-session</text>
  <text class="sub" x="325" y="140" text-anchor="middle">writes it</text>

  <rect class="node" x="455" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M520 75 h20 v18 h-20 z M526 81 h8 M526 87 h8 M526 93 h6"/>
  <text class="label" x="540" y="125" text-anchor="middle">status file</text>
  <text class="sub" x="540" y="140" text-anchor="middle">sessions/id</text>

  <rect class="node" x="670" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M735 75 h22 v18 h-22 z M739 79 h8 M739 83 h14 M739 87 h10"/>
  <text class="label" x="755" y="125" text-anchor="middle">Herdr panel</text>
  <text class="sub" x="755" y="140" text-anchor="middle">reads it</text>

  <path class="path" d="M195 100 H240"/><path id="sessionfile-arrow-1" class="arrowhead" d="M232 95 L240 100 L232 105 z"/>
  <path class="path" d="M410 100 H455"/><path id="sessionfile-arrow-2" class="arrowhead" d="M447 95 L455 100 L447 105 z"/>
  <path class="path" d="M625 100 H670"/><path id="sessionfile-arrow-3" class="arrowhead" d="M662 95 L670 100 L662 105 z"/>
  <circle class="marker" cx="645" cy="55" r="11"/><text class="glyph" x="645" y="59" text-anchor="middle">2s</text>
  <text class="sub" x="645" y="38" text-anchor="middle">poll</text>
  <rect class="chip" x="870" y="87" width="105" height="26" rx="13"/><text class="chip-text" x="922" y="104" text-anchor="middle">focused</text>
  <path class="path" d="M840 100 H870"/><path id="sessionfile-arrow-4" class="arrowhead" d="M862 95 L870 100 L862 105 z"/>
</svg>
