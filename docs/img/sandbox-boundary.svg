<svg xmlns="http://www.w3.org/2000/svg" width="1078" height="418" viewBox="16 4 1078 418" role="img" aria-label="Where the sandbox line runs. On the host: the broker, which runs the sandbox runtime and wraps each command; Pi and Jig's tools, which work through jig-core's rules with your credentials; your own ! commands, which are never sandboxed; and the network, the machine's own in open mode and through the proxy in filtered and ask modes. Inside the sandbox: the agent's bash, foreground and background; hidden paths, which cannot be read, such as the credential files jig-core protects; locked paths, read but never written, such as shell start-up files; ask-first paths, the toolchain folders, writable once you say yes; and everything else, writable as outside." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f6f7f9; stroke: #d9dde3; stroke-width: 1.2; }
    .panel { fill: none; stroke: #5c626b; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .title { fill: #5c626b; font-size: 12px; font-weight: 700; }
    .label { fill: #1a1b1e; font-size: 14px; font-weight: 700; }
    .sub { fill: #5c626b; font-size: 11px; }
    .edge { fill: #5c626b; font-size: 10px; }
    .glyph { fill: #2563eb; font-size: 12px; font-weight: 700; }
    .accent { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .path { fill: none; stroke: #2563eb; stroke-width: 2; }
    .arrowhead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #111113; }
      .node { fill: #18181b; stroke: #2c2c31; }
      .panel { stroke: #9a9aa2; }
      .title { fill: #9a9aa2; }
      .label { fill: #e7e7ea; }
      .sub { fill: #9a9aa2; }
      .edge { fill: #9a9aa2; }
      .glyph { fill: #7aa2f7; }
      .accent { stroke: #7aa2f7; }
      .path { stroke: #7aa2f7; }
      .arrowhead { fill: #7aa2f7; }
    }
  </style>
  <rect class="bg" x="16.5" y="4.5" width="1077" height="417" rx="12"/>

  <!-- on the host -->
  <text class="title" x="40" y="38">on the host</text>

  <rect class="node" x="40" y="50" width="320" height="60" rx="10"/>
  <circle class="accent" cx="78" cy="80" r="7"/>
  <path class="accent" d="M78 69 v4 M78 87 v4 M67 80 h4 M85 80 h4 M70 72 l2.6 2.6 M83 85 l2.6 2.6 M86 72 l-2.6 2.6 M70 88 l2.6 -2.6"/>
  <text class="label" x="124" y="76">the broker</text>
  <text class="sub" x="124" y="93">the sandbox runtime</text>

  <rect class="node" x="40" y="122" width="320" height="60" rx="10"/>
  <rect class="accent" x="68" y="136" width="20" height="15" rx="2"/>
  <path class="accent" d="M72 151 v6 M84 151 v6 M64 157 h28"/>
  <text class="label" x="124" y="148">Pi</text>
  <text class="sub" x="124" y="165">one session</text>

  <rect class="node" x="40" y="194" width="320" height="60" rx="10"/>
  <path class="accent" d="M69 210 h14 a2 2 0 0 1 2 2 v4 h-14 a2 2 0 0 1 -2 -2 z"/>
  <path class="accent" d="M76 216 h2 M76 216 v18"/>
  <text class="label" x="124" y="220">Jig's tools</text>
  <text class="sub" x="124" y="237">rules and credentials</text>

  <rect class="node" x="40" y="266" width="320" height="60" rx="10"/>
  <circle class="accent" cx="78" cy="296" r="11"/>
  <path class="accent" d="M78 290 v7 M78 302 v1.5"/>
  <text class="label" x="124" y="292">your ! commands</text>
  <text class="sub" x="124" y="309">never sandboxed</text>

  <rect class="node" x="40" y="338" width="320" height="60" rx="10"/>
  <circle class="accent" cx="78" cy="368" r="11"/>
  <path class="accent" d="M67 368 h22 M78 357 a14 11 0 0 1 0 22 M78 357 a14 11 0 0 0 0 22"/>
  <text class="label" x="124" y="364">the network</text>
  <text class="sub" x="124" y="381">open, filtered or ask</text>

  <!-- inside the sandbox -->
  <rect class="panel" x="430" y="50" width="640" height="348" rx="12"/>
  <text class="title" x="446" y="38">inside the sandbox</text>

  <rect class="node" x="450" y="66" width="600" height="60" rx="10"/>
  <path class="accent" d="M476 82 l6 6 -6 6 M488 94 h10"/>
  <text class="label" x="546" y="88">agent's bash</text>
  <text class="sub" x="546" y="105">foreground and background</text>

  <rect class="node" x="450" y="150" width="290" height="100" rx="10"/>
  <path class="accent" d="M481 191 q15 -13 30 0 q-15 13 -30 0 z"/>
  <circle class="accent" cx="496" cy="191" r="4.4"/>
  <path class="accent" d="M479 209 L514 177"/>
  <text class="label" x="544" y="195">hidden</text>
  <text class="sub" x="544" y="213">credentials</text>

  <rect class="node" x="760" y="150" width="290" height="100" rx="10"/>
  <rect class="accent" x="784" y="185" width="18" height="15" rx="2"/>
  <path class="accent" d="M788 185 v-4 a5 5 0 0 1 10 0 v4"/>
  <text class="label" x="824" y="191">locked</text>
  <text class="sub" x="824" y="209">start-up files</text>

  <rect class="node" x="450" y="274" width="290" height="100" rx="10"/>
  <circle class="accent" cx="496" cy="315" r="11"/>
  <text class="glyph" x="496" y="320" text-anchor="middle">?</text>
  <text class="label" x="544" y="319">ask first</text>
  <text class="sub" x="544" y="337">toolchains</text>

  <rect class="node" x="760" y="274" width="290" height="100" rx="10"/>
  <path class="accent" d="M786 325 l18 -14 5 5 -18 14 -6 1 z"/>
  <path class="accent" d="M782 337 h26"/>
  <text class="label" x="824" y="319">writable</text>
  <text class="sub" x="824" y="337">the rest</text>

  <!-- the broker wraps each command -->
  <path class="path" d="M360 80 H430"/>
  <path id="sandboxb55-arrow-wrap" class="arrowhead" d="M422 75 L430 80 L422 85 z"/>
  <text class="edge" x="395" y="70" text-anchor="middle">wraps</text>
</svg>
