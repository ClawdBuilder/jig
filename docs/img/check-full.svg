<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="The full check run in one path: tests run at HEAD; reports and new tests are checked; failures are compared with main by full name; a gate passes old failures and blocks only new ones." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <style>
    .bg{fill:#fff}.node{fill:#f6f7f9;stroke:#d9dde3;stroke-width:1.2}.label{fill:#1a1b1e;font-size:14px;font-weight:700}
    .sub{fill:#5c626b;font-size:11px}.accent{fill:none;stroke:#2563eb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .path{fill:none;stroke:#2563eb;stroke-width:2}.arrowhead{fill:#2563eb}.marker{fill:#fff;stroke:#2563eb;stroke-width:1.5}
    .glyph{fill:#2563eb;font-size:11px;font-weight:700}.ok{fill:#e6ffec;stroke:#1a7f37;stroke-width:1.2}.ok-text{fill:#1a7f37;font-size:12px;font-weight:700}
    .no{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}.no-text{fill:#cf222e;font-size:12px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111113}.node{fill:#18181b;stroke:#2c2c31}.label{fill:#e7e7ea}.sub{fill:#9a9aa2}
      .accent{stroke:#7aa2f7}.path{stroke:#7aa2f7}.arrowhead{fill:#7aa2f7}.marker{fill:#18181b;stroke:#7aa2f7}.glyph{fill:#7aa2f7}
      .ok{fill:#14251a;stroke:#6ccb8a}.ok-text{fill:#6ccb8a}.no{fill:#2a1618;stroke:#ff7b72}.no-text{fill:#ff7b72}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="189" rx="12"/>
  <rect class="node" x="25" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M100 75 v8 l-7 14 h14 l-7 -14 v-8 z M96 89 h8"/>
  <text class="label" x="110" y="125" text-anchor="middle">tests</text>
  <text class="sub" x="110" y="140" text-anchor="middle">at HEAD</text>

  <rect class="node" x="230" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M300 76 l3 3 5 -5 M300 86 l3 3 5 -5 M300 96 l3 3 5 -5 M314 76 h10 M314 87 h10 M314 98 h10"/>
  <text class="label" x="315" y="125" text-anchor="middle">checks</text>
  <text class="sub" x="315" y="140" text-anchor="middle">reports · new</text>

  <rect class="node" x="435" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M510 74 v18 M500 78 h20 M500 78 l-4 8 h8 M520 78 l-4 8 h8"/>
  <text class="label" x="520" y="125" text-anchor="middle">compare</text>
  <text class="sub" x="520" y="140" text-anchor="middle">with main</text>

  <rect class="node" x="640" y="60" width="170" height="80" rx="12"/>
  <path class="accent" d="M710 74 v20 M724 74 v20 M708 88 l18 -6"/>
  <text class="label" x="725" y="125" text-anchor="middle">gate</text>
  <text class="sub" x="725" y="140" text-anchor="middle">jig-core</text>

  <path class="path" d="M195 100 H230"/><path id="checkfull-c1-arrow-1" class="arrowhead" d="M222 95 L230 100 L222 105 z"/>
  <path class="path" d="M400 100 H435"/><path id="checkfull-c1-arrow-2" class="arrowhead" d="M427 95 L435 100 L427 105 z"/>
  <path class="path" d="M605 100 H640"/><path id="checkfull-c1-arrow-3" class="arrowhead" d="M632 95 L640 100 L632 105 z"/>
  <path class="path" d="M810 90 H845"/><path id="checkfull-c1-arrow-4" class="arrowhead" d="M837 85 L845 90 L837 95 z"/>
  <path class="path" d="M810 110 H845 V135 H860"/><path id="checkfull-c1-arrow-5" class="arrowhead" d="M852 130 L860 135 L852 140 z"/>
  <rect class="ok" x="845" y="77" width="62" height="26" rx="13"/><text class="ok-text" x="876" y="94" text-anchor="middle">pass</text>
  <rect class="no" x="860" y="122" width="62" height="26" rx="13"/><text class="no-text" x="891" y="139" text-anchor="middle">fail</text>
</svg>
