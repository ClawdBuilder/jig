# Jig's tmux settings for Pi and its subagent panes. The `pi` launcher starts its own tmux server (`tmux -L jig`), so these
# settings never change a tmux you run yourself. The launcher exports JIG_HOME, the folder this file's bin/ is in.

# Pi reads Esc as "stop": tmux's default 500 ms Esc delay makes it feel stuck.
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000

# True colour for the themes, and extended keys so Shift+Enter and friends reach Pi.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -as terminal-features ",*:extkeys"

# Mouse: click a pane to focus it, wheel to scroll its history, drag to select.
set -g mouse on

# Copy on select: releasing a drag copies to the system clipboard (bin/clipboard-copy) and leaves copy mode;
# double-click copies a word, triple-click a line. OSC 52 also goes to the terminal where it supports it.
set -s set-clipboard external
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "$JIG_HOME/bin/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$JIG_HOME/bin/clipboard-copy"
bind -n DoubleClick1Pane select-pane -t = \; copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel "$JIG_HOME/bin/clipboard-copy"
bind -n TripleClick1Pane select-pane -t = \; copy-mode -M \; send -X select-line \; send -X copy-pipe-and-cancel "$JIG_HOME/bin/clipboard-copy"

# Pane titles show which agent runs where, but only while there is more than one pane: with Pi alone the title row would
# take a line of its screen for nothing. window-layout-changed fires on every split, close and exit, in the window that
# changed. No status line: Pi's own footer carries the session state, and the row goes to Pi.
set -g pane-border-status off
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_title} "
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "set -w pane-border-status top" "set -w pane-border-status off"'
set -g status off
set -g set-titles on
set -g set-titles-string "#{pane_title}"
